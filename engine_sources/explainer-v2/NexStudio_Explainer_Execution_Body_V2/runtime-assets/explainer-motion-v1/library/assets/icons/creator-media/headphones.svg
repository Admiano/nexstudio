<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Headphones creator and media paper icon"><style>:root{--paper-surface:#fffdf8;--ink:#171419;--primary:#6d45d8;--secondary:#ffb648;--accent:#f25f3a;--highlight:#ffe681;--outline-width:4}.icon-paper-shape{fill:var(--paper-surface);stroke:var(--ink);stroke-width:var(--outline-width)}.icon-paper-edge{fill:none;stroke:var(--secondary);stroke-width:2;stroke-dasharray:2 5}.icon-paper-shadow{fill:#0002;transform:translate(4px,5px)}.icon-symbol-stroke{fill:none;stroke:var(--ink);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}.icon-symbol-fill{fill:var(--primary);stroke:var(--ink);stroke-width:5.5;stroke-linejoin:round}.icon-accent-stroke{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.icon-accent-fill{fill:var(--secondary);stroke:var(--ink);stroke-width:4.5}.icon-highlight-fill{fill:var(--highlight);stroke:var(--ink);stroke-width:4}.creator-count-text{font:bold 12px monospace;fill:var(--ink);text-anchor:middle}</style><g class="icon-shadow-layer"><path class="icon-paper-shadow" d="M16 27Q20 14 37 15L82 12Q100 17 103 34L106 79Q101 99 82 104L37 106Q18 101 14 83L12 43Q12 32 16 27Z"/></g><g class="icon-paper-layer"><path class="icon-paper-shape" d="M13 23Q20 12 36 14L84 11Q100 16 105 33L107 78Q103 98 83 103L36 106Q17 100 13 82L10 42Q10 30 13 23Z"/><path class="icon-paper-edge" d="M18 25Q24 18 38 19L82 16Q94 19 99 35L101 76Q97 91 80 97L38 99Q23 94 19 80L16 43Q16 31 18 25Z"/></g><g class="icon-symbol-layer"><path class="icon-symbol-stroke" d="M25 64V55C25 17 95 17 95 55V64"/><rect class="icon-symbol-fill" x="19" y="58" width="22" height="35" rx="9"/><rect class="icon-symbol-fill" x="79" y="58" width="22" height="35" rx="9"/><path class="icon-accent-stroke" d="M42 86C50 92 70 92 78 86"/></g><g class="icon-accent-layer"><path class="icon-accent-stroke" d="M88 92L97 83"/></g></svg>