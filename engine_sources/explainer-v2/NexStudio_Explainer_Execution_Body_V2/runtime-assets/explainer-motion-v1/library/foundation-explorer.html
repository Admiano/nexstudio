<!doctype html><html lang="en" data-paper-style="clean-editorial"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexStudio Paper Motion — Foundation Explorer</title><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/paper.css"><link rel="stylesheet" href="styles/explorer.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand">NEXSTUDIO<br>PAPER MOTION</div><div class="kicker">Batch 1 / Foundation Explorer</div><div class="controls">
<label class="control">Paper style<select id="styleSelect"><option value="clean-editorial">Clean editorial</option><option value="handmade-scrapbook">Handmade scrapbook</option><option value="technical-notebook">Technical notebook</option><option value="bold-paper-collage">Bold paper collage</option></select></label>
<label class="control">Palette<select id="paletteSelect"><option value="warm">Cream / plum / orange</option><option value="cobalt">White / cobalt / yellow</option><option value="charcoal">Charcoal / red / off-white</option></select></label>
<div class="control">Custom colours<div class="palette"><input id="primaryColor" type="color" value="#6d45d8" aria-label="Primary colour"><input id="secondaryColor" type="color" value="#ffb648" aria-label="Secondary colour"><input id="accentColor" type="color" value="#f25f3a" aria-label="Accent colour"></div></div>
<label class="control">Motion energy<select id="energySelect"><option>low</option><option selected>medium</option><option>high</option></select></label>
<div class="control"><button id="replayAll">Replay visible</button></div></div></aside>
<main class="main"><header class="hero"><div><div class="kicker">Reusable / configurable / agent-readable</div><h1>Paper is now a motion system.</h1></div><div class="counter" id="count">40</div></header>
<div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="surface">Surfaces</button><button class="filter" data-filter="edge">Edges</button><button class="filter" data-filter="shadow">Shadows</button><button class="filter" data-filter="print">Print</button><button class="filter" data-filter="fastener">Fasteners</button></div><section class="grid" id="componentGrid"></section></main></div>
<div class="manifest-panel" id="manifestPanel"><button id="manifestClose" style="float:right">Close</button><pre></pre></div>
<script src="vendor/gsap-compat.js"></script><script src="runtime/theme.js"></script><script src="runtime/foundation-registry.js"></script><script src="components/foundation-components.js"></script><script src="runtime/explorer.js"></script></body></html>
