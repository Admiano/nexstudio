<!doctype html><html lang="en" data-paper-style="clean-editorial"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexStudio Replaceable Media Containers</title><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/paper.css"><link rel="stylesheet" href="styles/motion.css"><link rel="stylesheet" href="styles/media-containers.css"><link rel="stylesheet" href="styles/media-explorer.css"></head><body><div class="media-app"><aside class="media-sidebar"><div class="media-brand">NEXSTUDIO<br>MEDIA SYSTEM</div><div class="media-kicker">Batch 9 · 24 replaceable animated containers</div><div class="media-controls-panel"><label class="media-control">Container<select id="mediaType"></select></label><label class="media-control">Source<select id="mediaSource"><option value="image">Local image</option><option value="video">Local video</option><option value="screenshot">Website screenshot</option><option value="transparent">Transparent PNG</option></select></label><label class="media-control">Crop<select id="mediaCrop"><option>cover</option><option>contain</option><option>fill</option></select></label><label class="media-control">Focal X<div class="media-range"><input id="mediaFocalX" type="range" min="0" max="100" value="50"><output id="mediaFocalXOut">50%</output></div></label><label class="media-control">Focal Y<div class="media-range"><input id="mediaFocalY" type="range" min="0" max="100" value="50"><output id="mediaFocalYOut">50%</output></div></label><label class="media-control">Border<select id="mediaBorder"><option>clean</option><option selected>taped</option><option>pinned</option><option>torn</option></select></label><label class="media-control">Paper style<select id="mediaStyle"><option value="clean-editorial">Clean editorial</option><option value="handmade-scrapbook">Handmade scrapbook</option><option value="technical-notebook">Technical notebook</option><option value="bold-paper-collage">Bold paper collage</option></select></label><label class="media-control">Palette<select id="mediaPalette"><option value="warm">Warm cream / plum</option><option value="cobalt">White / cobalt</option><option value="charcoal">Charcoal / red</option></select></label><label class="media-control">Motion<select id="mediaMotion"><option value="paper-slide">Paper slide</option><option value="cut-paper-pop">Cut-paper pop</option><option value="drop-and-settle">Drop and settle</option><option value="unfold">Unfold</option></select></label><label class="media-control">Energy<select id="mediaEnergy"><option>low</option><option selected>medium</option><option>high</option></select></label><label class="media-control">Title<input id="mediaTitle" value="Replaceable media"></label><label class="media-control">Body<textarea id="mediaBody">Content changes without rebuilding the animated container.</textarea></label><label class="media-control">Search<input id="mediaSearch" type="search" placeholder="phone, photo, social…"></label><label class="media-control"><button id="mediaReplay">REPLAY SELECTED</button></label></div></aside><main class="media-main"><header class="media-hero"><h1>DROP IN.<br>MOVE ON.</h1><div class="media-count"><span id="mediaCount">24</span> / 24</div></header><section class="media-live"><div id="mediaLiveStage" class="media-live-stage"></div><div class="media-live-meta"><h2 id="mediaLiveName"></h2><p>Change media, crop, focal point, paper treatment and copy without editing component source.</p><pre id="mediaManifest"></pre></div></section><section id="mediaGrid" class="media-grid-library"></section></main></div><script src="vendor/gsap-compat.js"></script><script src="runtime/theme.js"></script><script src="runtime/motion-registry.js"></script><script src="runtime/motion-engine.js"></script><script src="runtime/media-container-registry.js"></script><script src="components/media-containers.js"></script><script src="runtime/media-container-explorer.js"></script
