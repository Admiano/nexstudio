<!doctype html><html lang="en" data-paper-style="clean-editorial"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/paper.css"><link rel="stylesheet" href="styles/objects.css"><link rel="stylesheet" href="styles/icons.css"><link rel="stylesheet" href="styles/creator-icons.css"><link rel="stylesheet" href="styles/agent-icons.css"><link rel="stylesheet" href="styles/business-icons.css"><link rel="stylesheet" href="styles/typography.css"><link rel="stylesheet" href="styles/media-containers.css"><link rel="stylesheet" href="styles/data-visualisations.css"><link rel="stylesheet" href="styles/creator-modules.css"><link rel="stylesheet" href="styles/documentary-modules.css"><link rel="stylesheet" href="styles/scene-rigs.css"><link rel="stylesheet" href="styles/audio-system.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper-bg)}body{display:grid;place-items:center;padding:22px;box-sizing:border-box}.preview-stage{width:100%;height:100%;display:grid;place-items:center;position:relative}.preview-stage>section,.preview-stage>div{max-width:96%;max-height:94%}.placeholder{width:min(620px,92%);padding:38px;background:var(--paper-surface);border:3px solid var(--ink);box-shadow:12px 12px 0 var(--ink)}.placeholder h2{font:950 36px/1 var(--display-font);margin:0 0 12px}.placeholder p{font:700 13px/1.45 var(--mono-font)}.audio-card{width:min(620px,92%);padding:28px;background:var(--paper-surface);border:3px solid var(--ink);box-shadow:12px 12px 0 var(--ink)}.audio-card audio{width:100%;margin-top:18px}.approval{display:inline-block;padding:5px 8px;background:var(--secondary);border:2px solid var(--ink);font:900 10px var(--mono-font)}</style></head><body><main class="preview-stage" id="mount"></main>
<script src="vendor/gsap-compat.js"></script><script src="runtime/theme.js"></script><script src="runtime/motion-registry.js"></script><script src="runtime/motion-engine.js"></script><script src="runtime/foundation-registry.js"></script><script src="runtime/object-registry.js"></script><script src="runtime/icon-registry.js"></script><script src="runtime/creator-icon-registry.js"></script><script src="runtime/agent-icon-registry.js"></script><script src="runtime/business-icon-registry.js"></script><script src="runtime/typography-registry.js"></script><script src="runtime/media-container-registry.js"></script><script src="runtime/data-visualisation-registry.js"></script><script src="runtime/creator-module-registry.js"></script><script src="runtime/documentary-module-registry.js"></script><script src="runtime/scene-rig-registry.js"></script><script src="runtime/audio-registry.js"></script><script src="components/foundation-components.js"></script><script src="components/paper-objects.js"></script><script src="components/universal-icons.js"></script><script src="components/creator-icons.js"></script><script src="components/agent-icons.js"></script><script src="components/business-icons.js"></script><script src="components/typography.js"></script><script src="components/media-containers.js"></script><script src="components/data-visualisations.js"></script><script src="components/creator-modules.js"></script><script src="components/documentary-modules.js"></script><script src="components/scene-rigs.js"></script>
<script>
let current={entry:null,config:null,element:null,timeline:null};const mount=document.getElementById('mount');
function apiFor(e){if(e.category==='foundation')return NexFoundation;if(e.category==='paper-object')return NexPaperObjects;if(e.category==='typography')return NexTypography;if(e.category==='media-container')return NexMediaContainers;if(e.category==='data-visualisation'||e.category==='workflow-diagram')return NexDataVisualisations;if(e.category==='creator-module')return NexCreatorModules;if(e.category==='documentary-module')return NexDocumentaryModules;if(e.category==='scene-family')return NexSceneRigs;if(e.category==='icon'){if(e.id.includes('.creator.'))return NexCreatorIcons;if(e.id.includes('.agent.'))return NexAgentIcons;if(e.id.includes('.business.'))return NexBusinessIcons;return NexIcons}return null}
function theme(c){document.documentElement.dataset.paperStyle=c.paperStyle||'clean-editorial';[['--primary',c.primary],['--secondary',c.secondary],['--accent',c.accent]].forEach(([k,v])=>v&&document.documentElement.style.setProperty(k,v))}
function buildConfig(e,c){const sample=JSON.parse(JSON.stringify(e.sampleConfig||{}));const out={...sample,...c,style:c.paperStyle||sample.style||'clean-editorial',energy:c.motionEnergy||sample.energy||'medium',duration:Number(c.duration||sample.duration||e.duration?.recommended||2)};if(c.copy){out.title=c.copy;out.text=c.copy;out.caption=c.copy;out.body=c.copy}if(c.media)out.media=c.media;if(c.data){try{const d=typeof c.data==='string'?JSON.parse(c.data):c.data;Object.assign(out,d);if(d.items)out.items=d.items;if(d.nodes)out.nodes=d.nodes;if(d.edges)out.edges=d.edges}catch(_){}}return out}
function render(entry,config={}){current.entry=entry;current.config=config;mount.innerHTML='';theme(config);if(entry.category==='audio'){const d=document.createElement('div');d.className='audio-card';d.innerHTML=`<span class="approval">${entry.editorialApproval||'pending'} audio</span><h2>${entry.name}</h2><p>${(entry.semanticTags||[]).join(' · ')}</p><audio controls src="${entry.productionFile}"></audio>`;mount.append(d);current.element=d;return}
 const cfg=buildConfig(entry,config);let el,api=apiFor(entry);try{if(entry.category==='motion'){el=NexPaperObjects.create('rect-card',{title:entry.name,body:'Reusable motion attached through the shared engine.'});current.timeline=NexMotion.apply(el,entry.id,{duration:cfg.duration,energy:cfg.energy});}
 else if(api){el=api.create(entry.id,cfg);if(api.animate)current.timeline=api.animate(el,{duration:cfg.duration,energy:cfg.energy,motion:entry.defaultMotion}||cfg);}
 else throw Error('No runtime API');mount.append(el);current.element=el;if(current.timeline){current.timeline.seek(0);setTimeout(()=>current.timeline.play(),80)}}catch(err){const d=document.createElement('div');d.className='placeholder';d.innerHTML=`<h2>${entry.name}</h2><p>${entry.id}</p><p>${err.message}</p>`;mount.append(d);current.element=d}fit()}
function fit(){const el=current.element;if(!el)return;el.style.transform='';el.style.transformOrigin='center';const sw=mount.clientWidth-30,sh=mount.clientHeight-30,cw=Math.max(el.scrollWidth,el.offsetWidth,1),ch=Math.max(el.scrollHeight,el.offsetHeight,1),s=Math.min(1,sw/cw,sh/ch);if(s<1)el.style.transform=`scale(${Math.max(.28,s)})`}
window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='render')render(m.entry,m.config);if(m.type==='replay'&&current.timeline){current.timeline.restart()}if(m.type==='audition'&&m.src){const a=new Audio(m.src);a.volume=m.volume??.7;a.play()}});window.addEventListener('resize',fit);parent.postMessage({type:'master-preview-ready'},'*');
</script></body></html>
