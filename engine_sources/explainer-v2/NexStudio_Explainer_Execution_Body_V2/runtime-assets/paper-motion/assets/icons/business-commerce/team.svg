<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Team business and commerce paper icon"><style>:root{--paper-surface:#f8f2e7;--ink:#171717;--primary:#6d45d8;--secondary:#ffb648;--accent:#ff5a36;--highlight:#fff3a8;--outline-width:5}.icon-paper-shadow{fill:#17171730;transform:translate(4px,5px)}.icon-paper-shape{fill:var(--paper-surface);stroke:var(--ink);stroke-width:var(--outline-width);stroke-linejoin:round}.icon-paper-edge{fill:none;stroke:var(--secondary);stroke-width:2;stroke-dasharray:2 5}.icon-symbol-stroke{fill:none;stroke:var(--ink);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}.icon-symbol-fill{fill:var(--primary);stroke:var(--ink);stroke-width:5.5;stroke-linejoin:round}.icon-accent-stroke{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.icon-accent-fill{fill:var(--secondary);stroke:var(--ink);stroke-width:4.5;stroke-linejoin:round}.icon-highlight-fill{fill:var(--highlight);stroke:var(--ink);stroke-width:4}</style><g class="icon-shadow-layer"><path class="icon-paper-shadow" d="M17 23L48 13L88 18L104 44L99 88L73 105L31 100L14 72Z"/></g><g class="icon-paper-layer"><path class="icon-paper-shape" d="M14 19L47 10L89 15L106 42L101 87L74 103L29 98L11 70Z"/><path class="icon-paper-edge" d="M17 23L47 15L86 19L100 44L96 83L72 98L32 94L17 68Z"/></g><g class="icon-symbol-layer"><circle class="icon-highlight-fill" cx="60" cy="37" r="14"/><circle class="icon-accent-fill" cx="34" cy="49" r="12"/><circle class="icon-accent-fill" cx="86" cy="49" r="12"/><path class="icon-symbol-fill" d="M35 93C38 69 47 61 60 61C73 61 82 69 85 93Z"/><path class="icon-highlight-fill" d="M13 94C15 75 23 68 34 68C44 68 51 74 53 88L51 94Z"/><path class="icon-highlight-fill" d="M69 94L67 88C69 74 76 68 86 68C97 68 105 75 107 94Z"/></g><g class="icon-accent-layer"><path class="icon-accent-stroke" d="M91 95L101 85"/></g><g class="icon-state-layer"><circle cx="93" cy="28" r="0"/></g></svg>