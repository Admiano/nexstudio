<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 120 120" class="nex-icon-svg" aria-hidden="true"><title id="title">Forward universal paper icon</title><style>
:root{--paper-surface:#fffdf8;--paper-surface-alt:#f1e5cf;--ink:#171419;--primary:#6d45d8;--secondary:#ffb648;--accent:#f25f3a;--highlight:#ffe681;--outline-width:3px}
.icon-paper-shadow{fill:#17141922;transform:translate(4px,5px)}.icon-paper-shape{fill:var(--paper-surface);stroke:var(--ink);stroke-width:var(--outline-width);stroke-linejoin:round}.icon-paper-edge{fill:none;stroke:var(--secondary);stroke-width:2;stroke-dasharray:2 5}.icon-symbol-stroke{fill:none;stroke:var(--ink);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}.icon-symbol-fill{fill:var(--primary);stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}.icon-accent-stroke{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.icon-accent-fill{fill:var(--secondary);stroke:var(--ink);stroke-width:4.5;stroke-linejoin:round}.icon-highlight-fill{fill:var(--highlight);stroke:var(--ink);stroke-width:4}.icon-active-ring{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:5 7}.icon-complete-badge{opacity:0}
</style><g class="icon-shadow-layer"><path class="icon-paper-shadow" d="M16 27Q20 14 37 15L82 12Q100 17 103 34L106 79Q101 99 82 104L37 106Q18 101 14 83L12 43Q12 32 16 27Z"></path></g>
