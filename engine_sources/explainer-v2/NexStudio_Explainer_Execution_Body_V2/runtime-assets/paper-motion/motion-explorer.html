<!doctype html><html lang="en" data-paper-style="clean-editorial"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexStudio Paper Motion — Motion Matrix</title><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/paper.css"><link rel="stylesheet" href="styles/objects.css"><link rel="stylesheet" href="styles/motion.css"><link rel="stylesheet" href="styles/motion-matrix.css"></head><body class="motion-app">
<div class="motion-shell"><aside class="motion-sidebar"><div class="motion-brand">NEXSTUDIO<br>PAPER MOTION</div><div class="motion-kicker">Batch 3 / Core Motion Primitive Library</div><nav class="motion-nav"><a href="index.html">Batch 2 paper objects →</a><a href="foundation-explorer.html">Batch 1 foundations →</a><a href="compositions/transition-demo.html?autoplay=1">Transition demonstration →</a></nav><div class="motion-controls">
<label class="motion-control">Search<input id="motionSearch" placeholder="Search motions or intents"></label>
<label class="motion-control">Paper style<select id="motionStyle"><option value="clean-editorial">Clean editorial</option><option value="handmade-scrapbook">Handmade scrapbook</option><option value="technical-notebook">Technical notebook</option><option value="bold-paper-collage">Bold paper collage</option></select></label>
<label class="motion-control">Palette<select id="motionPalette"><option value="warm">Cream / plum / orange</option><option value="cobalt">White / cobalt / yellow</option><option value="charcoal">Charcoal / red / off-white</option></select></label>
<label class="motion-control">Preview ratio<select id="motionRatio"><option value="landscape">16:9</option><option value="square">1:1</option><option value="portrait">9:16</option></select></label>
<label class="motion-control">Energy<select id="motionEnergy"><option>low</option><option selected>medium</option><option>high</option></select></label>
<label class="motion-control">Duration<input id="motionDuration" type="range" min="0.45" max="4" value="1.1" step="0.05"><output id="durationOut">1.10s</output></label>
<label class="motion-control">Intensity<input id="motionIntensity" type="range" min="0.4" max="1.6" value="1" step="0.05"><output id="intensityOut">1.00×</output></label>
<label class="motion-control"><button id="replayVisible">Replay visible motions</button></label></div></aside>
<main class="motion-main"><header class="motion-hero"><div><div class="motion-kicker">32 deterministic behaviours / artwork-independent</div><h1>Motion that travels between objects.</h1></div><div class="motion-count" id="motionCount">32</div></header>
<div class="motion-filters"><button class="motion-filter active" data-filter="all">All</button><button class="motion-filter" data-filter="entrance">10 entrances</button><button class="motion-filter" data-filter="action">10 actions</button><button class="motion-filter" data-filter="ambient">5 ambient</button><button class="motion-filter" data-filter="transition">7 transitions</button></div>
<section class="motion-grid" id="motionGrid"></section></main></div>
<aside class="motion-manifest" id="motionManifest"><button id="motionManifestClose">Close</button><pre></pre></aside>
<script src="vendor/gsap-compat.js"></script><script src="runtime/theme.js"></script><script src="runtime/object-registry.js"></script><script src="components/paper-objects.js"></script><script src="runtime/motion-registry.js"></script><script src="runtime/motion-engine.js"></script><script src="runtime/motion-matrix.js"></script></body></html>
