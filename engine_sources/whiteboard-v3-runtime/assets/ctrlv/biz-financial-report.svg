<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <g>
                <!-- Folder Back -->
                <path d="M90 100 L140 100 L160 120 L310 120 V250 H90 Z" fill="#1A1A17"/>
                
                <g style="transform-origin: 200px 250px;">
                    <!-- Report Paper -->
                    <rect x="110" y="60" width="160" height="190" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
                    <!-- Data on Paper -->
                    <rect x="130" y="80" width="60" height="8" rx="2" fill="#F5F0E4"/>
                    <rect x="130" y="100" width="120" height="4" rx="2" fill="#F5F0E4" opacity="0.3"/>
                    
                    <!-- Chart on report -->
                    <rect x="140" y="150" width="20" height="40" rx="2" fill="#F5F0E4"/>
                    <rect style="animation-delay: 0.2s;" x="170" y="130" width="20" height="60" rx="2" fill="#1A1A17"/>
                    <rect style="animation-delay: 0.4s;" x="200" y="160" width="20" height="30" rx="2" fill="#F5F0E4"/>
                    <path d="M120 200 H240" stroke="#F5F0E4" stroke-width="2" stroke-linecap="round"/>
                </g>
                
                <!-- Folder Front -->
                <path d="M70 140 L330 140 L310 250 H90 Z" fill="#F5F0E4"/>
            </g>
            
            <g style="animation-delay: 0.5s;">
                <!-- Growth Arrow escaping folder -->
                <path d="M220 180 L260 140 L280 150 L340 60" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M310 60 L340 60 L340 90" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </g>
          </svg>