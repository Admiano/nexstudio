<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Main Profile Card -->
                <rect x="60" y="50" width="280" height="200" rx="12" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8"/>
                
                <!-- Avatar -->
                <g >
                    <circle cx="130" cy="120" r="40" fill="#1A1A17" opacity="0.2"/>
                    <circle cx="130" cy="110" r="15" fill="#1A1A17"/>
                    <path d="M100 150 Q130 120 160 150 Z" fill="#1A1A17"/>
                </g>
                
                <!-- Info Bars -->
                <rect x="190" y="90" width="120" height="15" rx="4" fill="#F5F0E4" opacity="0.2"/>
                <rect x="190" y="115" width="100" height="15" rx="4" fill="#F5F0E4" opacity="0.2"/>
                
                <!-- Demographic Data Rings -->
                <g transform="translate(130, 200)">
                    <circle cx="-60" cy="0" r="20" fill="none" stroke="#F5F0E4" stroke-width="8" stroke-dasharray="80 125"/>
                    <circle style="animation-delay: 0.2s;" cx="0" cy="0" r="20" fill="none" stroke="#F5F0E4" stroke-width="8" stroke-dasharray="100 125"/>
                    <circle style="animation-delay: 0.4s;" cx="60" cy="0" r="20" fill="none" stroke="#1A1A17" stroke-width="8" stroke-dasharray="60 125"/>
                </g>
                
                <text x="130" y="235" font-family="monospace" font-weight="bold" font-size="12" fill="#F5F0E4" text-anchor="middle">RESEARCH</text>
            </g>
          </svg>