<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Prism / Optics -->
            <g>
                <polygon points="200,100 240,180 160,180" fill="#F5F0E4" opacity="0.2"/>
                <polygon points="200,100 240,180 160,180" stroke="#F5F0E4" stroke-width="4" stroke-linejoin="round"/>
                
                <!-- Incoming Light -->
                <path d="M100 150 L180 150" stroke="white" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Outgoing Spectrum -->
                <path d="M220 150 L300 130" stroke="#1A1A17" stroke-width="4" stroke-linecap="round" style="animation-delay: 0.5s;"/>
                <path d="M220 150 L310 150" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" style="animation-delay: 0.7s;"/>
                <path d="M220 150 L300 170" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" style="animation-delay: 0.9s;"/>
            </g>
            
            <!-- Falling Apple -->
            <g>
                <!-- Apple Shadow on ground -->
                <ellipse cx="100" cy="250" rx="20" ry="5" fill="#F5F0E4" opacity="0.1"/>
                
                <path d="M100 210 C120 210 130 240 100 240 C70 240 80 210 100 210 Z" fill="#1A1A17"/>
                <!-- Stem -->
                <path d="M100 215 C105 205 110 200 115 200" stroke="#F5F0E4" stroke-width="3" stroke-linecap="round" fill="none"/>
                <!-- Leaf -->
                <path d="M110 210 C120 200 130 210 120 220 Z" fill="#F5F0E4"/>
                
                <!-- Gravity / Motion lines -->
                <path d="M100 80 L100 180" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" opacity="0.5"/>
            </g>
            <!-- Falling equation / thought -->
            <path style="animation-delay: -1s;" d="M75 140 H90 M75 150 H85 M75 160 H95" stroke="#F5F0E4" stroke-width="3" stroke-linecap="round"/>
          </svg>