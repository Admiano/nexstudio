<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;">
                <!-- Tripod Base -->
                <path d="M200 160 L140 280" stroke="#F5F0E4" stroke-width="12" stroke-linecap="round"/>
                <path d="M200 160 L260 280" stroke="#F5F0E4" stroke-width="12" stroke-linecap="round"/>
                <path style="animation-duration: 4s;" d="M200 160 L200 280" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Joint -->
                <rect x="170" y="140" width="60" height="30" rx="4" fill="#1A1A17" stroke="#F5F0E4" stroke-width="4"/>
                <circle cx="200" cy="155" r="8" fill="#F5F0E4"/>
                
                <!-- Instrument Body -->
                <g style="animation-duration: 5s;">
                    <path d="M180 140 V80 Q200 60 220 80 V140 Z" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                    <circle cx="200" cy="100" r="15" fill="#F5F0E4"/>
                    
                    <!-- Scope -->
                    <rect x="150" y="70" width="100" height="30" rx="8" fill="#1A1A17" stroke="#F5F0E4" stroke-width="6"/>
                    <rect x="140" y="65" width="20" height="40" rx="4" fill="#F5F0E4"/>
                    <rect x="240" y="65" width="10" height="40" rx="4" fill="#F5F0E4"/>
                </g>
                
                <!-- Laser Target Ray -->
                <path style="animation-duration: 4s;" d="M140 85 L20 85" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="10 10"/>
                <circle style="animation-duration: 4s; animation-delay: 0.3s;" cx="40" cy="85" r="4" fill="#F5F0E4"/>
            </g>
          </svg>