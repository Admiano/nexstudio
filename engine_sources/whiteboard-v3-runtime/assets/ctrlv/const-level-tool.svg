<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Level Body (Refined for meaningful tilt) -->
                <g transform="translate(200, 150)">
                    <g style="transform-origin: center; animation-duration: 4s; animation-direction: alternate; animation-timing-function: ease-in-out; transform: rotate(-8deg);">
                        <rect x="-140" y="-20" width="280" height="40" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8"/>
                        <!-- End caps -->
                        <rect x="-140" y="-20" width="20" height="40" rx="4" fill="#F5F0E4"/>
                        <rect x="120" y="-20" width="20" height="40" rx="4" fill="#F5F0E4"/>
                        
                        <!-- Middle Vial (Horizontal) -->
                        <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
                        <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#F5F0E4" opacity="0.3"/>
                        <path d="M-15 -12 V12 M15 -12 V12" stroke="#F5F0E4" stroke-width="2" opacity="0.5"/>
                        
                        <!-- Bubble (Moves in sync with tilt) -->
                        <g style="animation-duration: 4s; animation-direction: alternate; animation-timing-function: ease-in-out;">
                             <circle cx="0" cy="0" r="8" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="2"/>
                        </g>
                        
                        <!-- Side Vials -->
                        <circle cx="-90" cy="0" r="14" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
                        <circle cx="90" cy="0" r="14" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
                    </g>
                </g>
                <!-- Reference Line -->
                <line x1="60" y1="180" x2="340" y2="180" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="4 4" opacity="0.2"/>
            </g>
          </svg>