<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Motion blur -->
            <g stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" opacity="0.4">
                <path d="M20 210 H65 M10 225 H50 M30 240 H65"/>
            </g>

            <g>
                <!-- Rear Wheel -->
                <circle  cx="130" cy="235" r="45" fill="#F5F0E4"/>
                <circle cx="130" cy="235" r="20" fill="#F5F0E4"/>
                <circle cx="130" cy="235" r="8" fill="#F5F0E4"/>

                <!-- Front Wheel -->
                <circle  cx="300" cy="235" r="38" fill="#F5F0E4"/>
                <circle cx="300" cy="235" r="16" fill="#F5F0E4"/>
                <circle cx="300" cy="235" r="6" fill="#F5F0E4"/>

                <!-- Frame / engine block -->
                <path d="M155 230 L175 170 L240 165 L270 195 L270 230 Z" fill="#1A1A17"/>
                <!-- Tank -->
                <path d="M175 170 L240 165 L240 195 L175 195 Z" fill="#1A1A17"/>
