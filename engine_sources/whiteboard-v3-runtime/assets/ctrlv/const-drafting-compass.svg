<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Traced Circle (Background) -->
                <circle style="animation-duration: 4s;" cx="200" cy="200" r="80" fill="none" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="10 10" opacity="0.4"/>
                
                <!-- Compass Top Hinge -->
                <circle cx="200" cy="80" r="15" fill="#1A1A17" stroke="#F5F0E4" stroke-width="6"/>
                <rect x="195" y="50" width="10" height="30" fill="#1A1A17" stroke="#F5F0E4" stroke-width="4"/>
                
                <!-- Main Body Holder -->
                <g style="transform-origin: 200px 200px; animation-duration: 10s;">
                    <!-- Fixed Leg (Point) -->
                    <path d="M200 90 L180 200" stroke="#F5F0E4" stroke-width="10" stroke-linecap="round"/>
                    <path d="M180 200 L178 215 L175 200 Z" fill="#F5F0E4"/>
                    
                    <!-- Drawing Leg (Pencil) -->
                    <g style="transform-origin: 200px 90px; animation-duration: 4s; animation-direction: alternate; transform: rotate(30deg);">
                        <path d="M200 90 L220 200" stroke="#F5F0E4" stroke-width="10" stroke-linecap="round"/>
                        <!-- Pencil -->
                        <rect x="210" y="200" width="20" height="15" rx="2" fill="#1A1A17" stroke="#F5F0E4" stroke-width="2"/>
                        <path d="M220 215 L215 240 L225 240 Z" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="2"/>
                        <circle cx="220" cy="240" r="2" fill="#F5F0E4"/>
                        
                        <!-- Drawing path arc -->
                        <path d="M220 240 A 100 100 0 0 1 120 240" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
                    </g>
                </g>
            </g>
          </svg>