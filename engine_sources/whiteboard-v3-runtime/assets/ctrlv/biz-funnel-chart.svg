<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <g>
                <!-- Funnel Structure Left & Right Lines -->
                <path d="M100 60 L160 200 V250" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M300 60 L240 200 V250" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round" fill="none"/>
                
                <g>
                    <!-- Layer 1: Top (Wide) -->
                    <path d="M110 70 L290 70 L270 110 L130 110 Z" fill="#1A1A17"/>
                    <line x1="160" y1="90" x2="240" y2="90" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Layer 2: Middle -->
                    <path style="animation-delay: 0.3s;" d="M135 120 L265 120 L245 160 L155 160 Z" fill="#F5F0E4"/>
                    <line x1="180" y1="140" x2="220" y2="140" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Layer 3: Bottom Funnel -->
                    <path style="animation-delay: 0.6s;" d="M160 170 L240 170 L220 200 L180 200 Z" fill="#F5F0E4"/>
                    <line x1="190" y1="185" x2="210" y2="185" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                </g>
                
                <!-- Output Drops/Coins going down -->
                <g>
                    <circle cx="200" cy="220" r="8" fill="#F5F0E4"/>
                    <circle cx="200" cy="245" r="8" fill="#F5F0E4"/>
                </g>
                
                <!-- Abstract Data particles entering top -->
                <circle cx="160" cy="40" r="5" fill="#F5F0E4"/>
                <circle cx="200" cy="30" r="6" fill="#F5F0E4"/>
                <circle cx="250" cy="45" r="4" fill="#1A1A17"/>
                <line x1="200" y1="45" x2="200" y2="60" stroke="#F5F0E4" stroke-width="3" stroke-linecap="round"/>
            </g>
          </svg>