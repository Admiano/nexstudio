<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Floating Heart beat abstract behind -->
            <path style="animation-duration: 1s;" d="M150 150 L170 150 L180 120 L195 180 L205 150 L250 150" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.2"/>
            
            <g>
                <!-- Earpieces -->
                <g>
                    <circle cx="150" cy="50" r="12" fill="#F5F0E4" stroke="#1A1A17" stroke-width="4"/>
                    <circle cx="250" cy="50" r="12" fill="#F5F0E4" stroke="#1A1A17" stroke-width="4"/>
                    
                    <!-- Metal Tubes -->
                    <path d="M150 62 C150 100 200 150 200 150" fill="none" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                    <path d="M250 62 C250 100 200 150 200 150" fill="none" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                </g>
                
                <!-- Y-Connector -->
                <path d="M190 140 L210 140 L205 160 L195 160 Z" fill="#1A1A17"/>
                
                <!-- Flexible Tube arranged in a heart-like loop -->
                <path d="M200 160 C200 280 280 240 280 180 C280 140 200 120 200 200" fill="none" stroke="#1A1A17" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Chestpiece (Bell/Diaphragm) -->
                <circle cx="200" cy="200" r="25" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                <circle cx="200" cy="200" r="12" fill="#F5F0E4"/>
            </g>
          </svg>