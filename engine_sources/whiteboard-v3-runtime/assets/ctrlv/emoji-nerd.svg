                <rect x="185" y="202" width="12" height="15" fill="#F5F0E4"/>
                <rect x="203" y="202" width="12" height="15" fill="#F5F0E4"/>
                
                <!-- Glasses -->
                <circle cx="160" cy="130" r="30" stroke="#F5F0E4" stroke-width="8" fill="#F5F0E4" opacity="0.9"/>
                <circle cx="240" cy="130" r="30" stroke="#F5F0E4" stroke-width="8" fill="#F5F0E4" opacity="0.9"/>
                <path d="M190 130 H210" stroke="#F5F0E4" stroke-width="8"/>
                <path d="M130 130 H100 M270 130 H300" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Eyes in Glasses -->
