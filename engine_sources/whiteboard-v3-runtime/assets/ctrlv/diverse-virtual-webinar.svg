                <rect style="animation-delay: 0.6s;" x="295" y="155" width="35" height="25" rx="3" fill="#F5F0E4"/>
                
                <!-- Controls -->
                <circle cx="160" cy="200" r="8" fill="#F5F0E4"/>
                <circle cx="190" cy="200" r="8" fill="#F5F0E4" opacity="0.4"/>
