                <path d="M90 140 L120 100 L160 130 L210 70 M210 70 L190 70 M210 70 V90" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                
                <!-- Speaker Video Feed -->
                <rect x="255" y="50" width="75" height="60" rx="5" fill="#F5F0E4"/>
