<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- House Silhouette (Primary) -->
            <path d="M70 260 V140 L160 60 L240 130 V260 H70 Z" fill="#1A1A17" opacity="0.8"/>
            <!-- Chimney and Roof trim -->
            <rect x="90" y="80" width="20" height="40" fill="#1A1A17"/>
            <path d="M60 150 L160 60 L250 140" stroke="#1A1A17" stroke-width="12" stroke-linecap="round" fill="none"/>
            <rect x="180" y="180" width="40" height="80" rx="4" fill="#F8FAFC"/>
            
            <!-- Floating Key (Primary) -->
            <g style="animation-delay: -1s">
                <path d="M220 200 L320 100" stroke="#1A1A17" stroke-width="16" stroke-linecap="round"/>
                <circle cx="330" cy="90" r="30" fill="#1A1A17"/>
                <circle cx="330" cy="90" r="12" fill="#F8FAFC"/>
                <!-- Key Teeth (Charcoal Accent) -->
                <rect x="230" y="170" width="20" height="15" rx="4" fill="#F5F0E4" transform="rotate(-45 230 170)"/>
                <rect x="250" y="150" width="20" height="25" rx="4" fill="#F5F0E4" transform="rotate(-45 250 150)"/>
            </g>
            
            <!-- Magic Sparks -->
            <circle cx="190" cy="110" r="8" fill="#F5F0E4"/>
            <circle cx="120" cy="80" r="5" fill="#F5F0E4" style="animation-delay: -0.5s"/>
            <circle cx="130" cy="180" r="12" fill="#F5F0E4" opacity="0.4"/>
          </svg>