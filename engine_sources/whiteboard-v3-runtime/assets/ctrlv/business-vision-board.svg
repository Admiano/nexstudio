<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Corkboard / Canvas -->
                <rect x="50" y="40" width="300" height="220" rx="8" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8"/>
                
                <!-- Strings/Connections -->
                <path d="M110 100 L200 130 L280 90 M200 130 L250 200 M200 130 L130 190" stroke="#F5F0E4" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
                
                <!-- Card 1 (Top Left) -->
                <g transform="translate(110, 100)">
                    <rect x="-30" y="-30" width="60" height="60" rx="4" fill="#1A1A17" transform="rotate(-10)"/>
                    <circle cx="0" cy="0" r="10" fill="#F5F0E4"/>
                    <circle cx="-20" cy="-20" r="4" fill="#F5F0E4"/> <!-- Pin -->
                </g>
                
                <!-- Card 2 (Top Right) -->
                <g transform="translate(280, 90)">
                    <rect x="-30" y="-20" width="60" height="40" rx="4" fill="#F5F0E4" transform="rotate(15)"/>
                    <g transform="rotate(15)">
                <path style="animation-delay: 0.2s;" d="M-10 5 L0 -5 L10 5" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" fill="none" />
            </g>
                    <circle cx="0" cy="-15" r="4" fill="#F5F0E4"/>
                </g>
                
                <!-- Card 3 (Center) -->
                <g transform="translate(200, 130)">
                    <circle cx="0" cy="0" r="30" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                    <path d="M-10 0 L0 -10 L10 0 L0 10 Z" fill="#F5F0E4"/>
                    <circle cx="0" cy="-35" r="4" fill="#F5F0E4"/>
                </g>
                
                <!-- Card 4 (Bottom Right) -->
                <g transform="translate(250, 200)">
                    <rect x="-25" y="-30" width="50" height="60" rx="4" fill="#F5F0E4" opacity="0.8" transform="rotate(-5)"/>
                    <circle style="animation-delay: 0.4s;" cx="0" cy="0" r="12" fill="#1A1A17"/>
                    <circle cx="-15" cy="-20" r="4" fill="#F5F0E4"/>
                </g>
                
                <!-- Card 5 (Bottom Left) -->
                <g transform="translate(130, 190)">
                    <rect x="-40" y="-20" width="80" height="40" rx="4" fill="#F5F0E4"/>
                    <path d="M-20 0 H20" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="0" cy="-15" r="4" fill="#F5F0E4"/>
                </g>
            </g>
          </svg>