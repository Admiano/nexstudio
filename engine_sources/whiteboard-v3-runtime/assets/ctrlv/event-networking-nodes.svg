<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Background Connections -->
                <path d="M100 100 L200 150 L300 100 M100 200 L200 150 L300 200 M200 50 V250" stroke="#F5F0E4" stroke-width="2" opacity="0.2"/>
                
                <!-- Main Node Center -->
                <g transform="translate(200, 150)">
                    <g >
                    <circle cx="0" cy="0" r="40" fill="#1A1A17" opacity="0.2"/>
                    <circle cx="0" cy="0" r="25" fill="#1A1A17"/>
                    <path d="M-10 0 C-10 -10 10 -10 10 0 V10 H-10 Z" fill="#F5F0E4"/>
                </g>
                </g>
                
                <!-- Satellite Nodes -->
                <g transform="translate(100, 100)">
                    <g >
                    <circle cx="0" cy="0" r="20" fill="#F5F0E4"/>
                    <circle cx="0" cy="-5" r="6" fill="#F5F0E4"/>
                    <path d="M-8 8 Q0 2 8 8" stroke="#F5F0E4" stroke-width="2" fill="none"/>
                </g>
                </g>
                <g transform="translate(300, 100)">
                    <g transform="translate(180, 10)">
                    <g>
                        <circle cx="0" cy="0" r="10" fill="#F5F0E4"/>
                        <circle cx="0" cy="0" r="4" fill="#F5F0E4"/>
                    </g>
                </g>
                </g>
                <g transform="translate(100, 200)">
                    <g  style="animation-delay: 0.4s;">
                    <circle cx="0" cy="0" r="20" fill="#1A1A17" opacity="0.7"/>
                </g>
                </g>
                <g transform="translate(300, 200)">
                    <g  style="animation-delay: 0.6s;">
                    <circle cx="0" cy="0" r="20" fill="#F5F0E4" opacity="0.7"/>
                </g>
                </g>
                
                <!-- Interaction Arcs -->
                <path style="animation-delay: 0.8s;" d="M120 100 Q200 80 280 100" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="4 4" fill="none"/>
            </g>
          </svg>