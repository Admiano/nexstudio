<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sound Block -->
            <ellipse cx="120" cy="220" rx="60" ry="15" fill="#F5F0E4"/>
            <path d="M60 220 V235 C60 250 180 250 180 235 V220 Z" fill="#1A1A17"/>
            
            <!-- Gavel -->
            <g >
                <!-- Handle -->
                <rect transform="rotate(25 280 100)" x="270" y="80" width="20" height="150" rx="10" fill="#1A1A17"/>
                <!-- Head -->
                <g transform="rotate(25 280 100) translate(280, 80)">
                    <rect x="-40" y="-20" width="80" height="40" rx="5" fill="#F5F0E4"/>
                    <rect x="-45" y="-15" width="10" height="30" rx="3" fill="#F5F0E4"/>
                    <rect x="35" y="-15" width="10" height="30" rx="3" fill="#F5F0E4"/>
                    <circle cx="0" cy="0" r="10" fill="#F5F0E4"/>
                </g>
            </g>
            <!-- Impact Lines -->
            <g>
                <path d="M120 180 L120 150 M90 190 L60 170 M150 190 L180 170" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" fill="none"/>
            </g>
          </svg>