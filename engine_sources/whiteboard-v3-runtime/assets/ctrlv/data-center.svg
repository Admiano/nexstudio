<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#e2e8f0" opacity="0.6"/>
            <!-- Perspective Floor lines -->
            <path d="M40 270 L140 180 M360 270 L260 180" stroke="#F5F0E4" stroke-width="2" fill="none" opacity="0.1"/>
            
            <!-- Back Server Rack -->
            <rect x="160" y="60" width="80" height="180" rx="4" fill="#1A1A17" opacity="0.6" style="animation-delay:-1s"/>
            
            <!-- Left Server Rack -->
            <rect x="80" y="80" width="80" height="180" rx="4" fill="#1A1A17"/>
            <rect x="80" y="80" width="20" height="180" rx="4" fill="#F5F0E4" opacity="0.1"/>
            
            <!-- Right Server Rack -->
            <rect x="240" y="100" width="80" height="180" rx="4" fill="#1A1A17" opacity="0.9" style="animation-delay:-0.5s"/>
            <rect x="240" y="100" width="20" height="180" rx="4" fill="#F5F0E4" opacity="0.1" style="animation-delay:-0.5s"/>
            
            <!-- Server Units Details (Left) -->
            <!-- We will use a group and pulse to show data processing -->
            <g>
                <rect x="105" y="100" width="45" height="15" rx="2" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="115" cy="107" r="3" fill="#F5F0E4"/>
                <rect x="105" y="125" width="45" height="15" rx="2" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="115" cy="132" r="3" fill="#F5F0E4"/>
                <rect x="105" y="150" width="45" height="15" rx="2" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="115" cy="157" r="3" fill="#F5F0E4"/>
                <rect x="105" y="175" width="45" height="15" rx="2" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="115" cy="182" r="3" fill="#F5F0E4"/>
            </g>

            <!-- Server Units Details (Right) -->
            <g style="animation-delay:-0.5s">
                <rect x="265" y="120" width="45" height="15" rx="2" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="275" cy="127" r="3" fill="#F5F0E4"/>
                <rect x="265" y="145" width="45" height="15" rx="2" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="275" cy="152" r="3" fill="#F5F0E4"/>
                <rect x="265" y="170" width="45" height="15" rx="2" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="275" cy="177" r="3" fill="#F5F0E4"/>
            </g>

            <!-- Data streams connecting racks -->
            <path d="M160 220 L240 240 M160 200 L240 220" stroke="#F5F0E4" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
            <path d="M200 60 V10" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
          </svg>