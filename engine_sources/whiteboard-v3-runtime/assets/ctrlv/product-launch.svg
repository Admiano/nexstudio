<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="130" ry="10" fill="#E2E8F0"/>
            <g>
                <!-- Background Glow -->
                <circle cx="200" cy="180" r="100" fill="#F5F0E4" opacity="0.3"/>
                
                <!-- Open Cardboard Box -->
                <path d="M140 240 L260 240 L280 180 H120 Z" fill="#F5F0E4"/>
                <!-- Box Flaps -->
                <path d="M120 180 L80 200 L120 240 Z" fill="#1A1A17"/>
                <path style="animation-delay: 0.2s;" d="M280 180 L320 200 L280 240 Z" fill="#1A1A17"/>
                <path style="animation-delay: 0.1s;" d="M120 180 L200 150 L280 180 Z" fill="#F5F0E4"/>
                
                <!-- Product Emerging -->
                <g style="animation-duration: 4s;">
                    <rect x="170" y="80" width="60" height="90" rx="10" fill="#1A1A17"/>
                    <rect x="180" y="90" width="40" height="60" rx="4" fill="white" opacity="0.8"/>
                    <circle cx="200" cy="120" r="15" fill="#F5F0E4"/>
                </g>
                
                <!-- Sparkles + Magic -->
                <path d="M120 100 L130 110 M270 90 L260 100 M200 50 V70 M160 70 L170 80 M240 70 L230 80" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                <circle cx="130" cy="120" r="4" fill="#F5F0E4"/>
                <circle cx="270" cy="130" r="5" fill="#F5F0E4"/>
            </g>
          </svg>