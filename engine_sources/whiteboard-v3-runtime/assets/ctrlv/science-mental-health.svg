<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
              <!-- Background glow -->
              <circle cx="200" cy="150" r="120" fill="#1A1A17" opacity="0.04"/>

              <!-- Brain outline (stylized) -->
              <g transform="translate(200, 130)">
                <g style="animation-duration: 3s;">
                  <!-- Left hemisphere -->
                  <path d="M0 -60 C-10 -80 -50 -80 -60 -50 C-75 -30 -70 0 -50 15 C-40 22 -30 30 -20 35 C-10 40 0 40 0 40 Z" fill="#1A1A17" opacity="0.15" stroke="#1A1A17" stroke-width="3"/>
                  <!-- Right hemisphere -->
                  <path d="M0 -60 C10 -80 50 -80 60 -50 C75 -30 70 0 50 15 C40 22 30 30 20 35 C10 40 0 40 0 40 Z" fill="#F5F0E4" opacity="0.15" stroke="#F5F0E4" stroke-width="3"/>
                  <!-- Center divide -->
                  <line x1="0" y1="-60" x2="0" y2="40" stroke="#F5F0E4" stroke-width="2" opacity="0.2" stroke-dasharray="4 4"/>
                  <!-- Brain folds left -->
                  <path d="M-30 -40 Q-50 -20 -30 0 Q-10 20 -30 40" stroke="#1A1A17" stroke-width="3" fill="none" opacity="0.6"/>
                  <path d="M-50 -10 Q-65 5 -50 20" stroke="#1A1A17" stroke-width="3" fill="none" opacity="0.4"/>
                  <!-- Brain folds right -->
                  <path d="M30 -40 Q50 -20 30 0 Q10 20 30 40" stroke="#F5F0E4" stroke-width="3" fill="none" opacity="0.6"/>
                  <path d="M50 -10 Q65 5 50 20" stroke="#F5F0E4" stroke-width="3" fill="none" opacity="0.4"/>
                </g>
              </g>

              <!-- Synaptic connections / sparks -->
              <g style="animation-duration: 2s;">
                <circle cx="148" cy="90" r="5" fill="#1A1A17"/>
                <circle cx="255" cy="95" r="5" fill="#F5F0E4"/>
                <circle cx="200" cy="70" r="5" fill="#F5F0E4"/>

                <!-- Connection lines -->
                <line x1="148" y1="90" x2="178" y2="110" stroke="#1A1A17" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
                <line x1="255" y1="95" x2="222" y2="110" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
                <line x1="200" y1="70" x2="200" y2="100" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
              </g>

              <!-- Heart symbol (emotional health) -->
              <g transform="translate(200, 250)">
        <g style="animation-duration: 1.5s;">
        
                <path d="M0 10 C-5 5 -20 5 -20 -5 C-20 -15 -10 -15 0 -5 C10 -15 20 -15 20 -5 C20 5 5 5 0 10 Z" fill="#F5F0E4" opacity="0.8"/>
              
        </g>
    </g>

              <!-- Calming radiating rings -->
              <g style="animation-duration: 4s; animation-delay: -2s;" opacity="0.15">
                <circle cx="200" cy="150" r="80" stroke="#1A1A17" stroke-width="2" fill="none"/>
                <circle cx="200" cy="150" r="100" stroke="#1A1A17" stroke-width="1" fill="none"/>
              </g>

              <!-- Positive thought icons (floating) -->
              <g transform="translate(80, 90)">
        <g style="animation-duration: 6s;">
        
                <!-- Sun -->
                <circle cx="0" cy="0" r="12" fill="#F5F0E4" opacity="0.6"/>
                <g stroke="#F5F0E4" stroke-width="2" opacity="0.6">
                  <line x1="0" y1="-18" x2="0" y2="-24"/>
                  <line x1="18" y1="0" x2="24" y2="0"/>
                  <line x1="0" y1="18" x2="0" y2="24"/>
                  <line x1="-18" y1="0" x2="-24" y2="0"/>
                  <line x1="13" y1="-13" x2="17" y2="-17"/>
                  <line x1="13" y1="13" x2="17" y2="17"/>
                
        </g>
    </g>
              </g>

              <g transform="translate(310, 100)">
        <g style="animation-duration: 7s; animation-delay: -3s;">
        
                <!-- Leaf / growth symbol -->
                <path d="M0 20 C0 0 -20 -10 0 -20 C20 -10 0 0 0 20 Z" fill="#1A1A17" opacity="0.5"/>
                <line x1="0" y1="20" x2="0" y2="-20" stroke="#1A1A17" stroke-width="2" opacity="0.5"/>
              
        </g>
    </g>
            </g>
          </svg>