<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Racks / Shelving -->
                <g stroke="#F5F0E4" stroke-width="6" stroke-linecap="round">
                    <line x1="100" y1="50" x2="100" y2="250"/>
                    <line x1="200" y1="50" x2="200" y2="250"/>
                    <line x1="300" y1="50" x2="300" y2="250"/>
                    
                    <line x1="80" y1="120" x2="320" y2="120"/>
                    <line x1="80" y1="180" x2="320" y2="180"/>
                    <line x1="80" y1="240" x2="320" y2="240"/>
                </g>
                
                <!-- Boxes on Shelves -->
                <!-- Top Shelf -->
                <rect x="120" y="80" width="40" height="40" rx="2" fill="#1A1A17"/>
                <line x1="125" y1="100" x2="155" y2="100" stroke="#F5F0E4" stroke-width="4"/>
                
                <!-- Middle Shelf -->
                <rect style="animation-delay: 0.2s;" x="140" y="140" width="40" height="40" rx="2" fill="#F5F0E4"/>
                <rect style="animation-delay: 0.3s;" x="220" y="140" width="60" height="40" rx="2" fill="#F5F0E4"/>
                <path d="M240 150 V170 M250 150 V170 M260 150 V170 M265 150 V170" stroke="#F5F0E4" stroke-width="3"/>
                
                <!-- Bottom Shelf -->
                <rect style="animation-delay: 0.4s;" x="110" y="200" width="50" height="40" rx="2" fill="#1A1A17"/>
                <rect style="animation-delay: 0.5s;" x="240" y="200" width="40" height="40" rx="2" fill="#F5F0E4"/>
                
                <!-- Scanner / Drone hovering -->
                <g transform="translate(60, 60)">
                    <g>
                    <rect x="0" y="0" width="30" height="15" rx="4" fill="#F5F0E4"/>
                    <circle cx="15" cy="-5" r="8" fill="#F5F0E4"/>
                    <!-- Laser Scan -->
                    <path d="M30 15 L80 60 L100 80" stroke="#F5F0E4" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
                </g>
                </g>
            </g>
          </svg>