        <rect x="216" y="100" width="80" height="140" rx="40" fill="#F5F0E4" fill-opacity="0.1" stroke="#F5F0E4" stroke-width="8"/>
        <line x1="216" y1="140" x2="296" y2="140" stroke="#F5F0E4" stroke-width="4" stroke-opacity="0.5"/>
        <line x1="216" y1="170" x2="296" y2="170" stroke="#F5F0E4" stroke-width="4" stroke-opacity="0.5"/>
        <line x1="216" y1="200" x2="296" y2="200" stroke="#F5F0E4" stroke-width="4" stroke-opacity="0.5"/>
        
