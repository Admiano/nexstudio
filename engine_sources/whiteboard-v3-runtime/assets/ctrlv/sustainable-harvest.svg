            <rect x="150" y="170" width="40" height="30" fill="white" opacity="0.6"/>
            <circle cx="130" cy="250" r="20" fill="#F5F0E4"/>
            <circle cx="230" cy="250" r="25" fill="#F5F0E4" style="animation-delay: -0.2s"/>
            <circle cx="130" cy="250" r="8" fill="white"/>
