            <!-- Crops being harvested -->
            <path d="M280 260 V220 M300 260 V230 M320 260 V210" stroke="#1A1A17" stroke-width="6" stroke-linecap="round"/>
            <path d="M340 260 V240 M360 260 V220" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
