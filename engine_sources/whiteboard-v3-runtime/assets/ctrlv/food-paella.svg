<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Pan (Paellera) -->
                <circle cx="200" cy="180" r="100" fill="#F5F0E4"/>
                <circle cx="200" cy="180" r="90" fill="#1A1A17"/>
                <!-- Handles -->
                <path d="M100 180 H70 M300 180 H330" stroke="#F5F0E4" stroke-width="15" stroke-linecap="round"/>
                
                <!-- Rice and Ingredients -->
                <g opacity="0.8">
                    <!-- Peas -->
                    <circle cx="160" cy="160" r="5" fill="#F5F0E4"/>
                    <circle cx="240" cy="160" r="5" fill="#F5F0E4"/>
                    <circle cx="200" cy="220" r="5" fill="#F5F0E4"/>
                    <circle cx="180" cy="190" r="5" fill="#F5F0E4"/>
                    
                    <!-- Shrimp/Prawns -->
                    <path d="M220 140 Q250 130 250 160" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" fill="none"/>
                    <path d="M150 200 Q120 190 120 220" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" fill="none"/>
                    
                    <!-- Mussels/Lemon -->
                    <rect x="190" y="140" width="20" height="15" rx="7" fill="#F5F0E4"/>
                    <path d="M220 200 L240 220 L200 210 Z" fill="#F5F0E4"/>
                </g>
                
                <!-- Sizzling Steam -->
                <path d="M180 120 Q200 100 220 120" stroke="#F5F0E4" stroke-width="2" opacity="0.5"/>
            </g>
          </svg>