<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Clock Face -->
                <circle cx="200" cy="150" r="90" fill="#F5F0E4" stroke="#1A1A17" stroke-width="12"/>
                
                <!-- Inner Progress/Circle -->
                <circle cx="200" cy="150" r="70" stroke="#F5F0E4" stroke-width="20" stroke-dasharray="20 15" fill="none"/>
                
                <!-- Infinity Loop/Hands -->
                <g >
                    <path d="M200 150 L200 100" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                    <path d="M200 150 L240 180" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="200" cy="150" r="8" fill="#F5F0E4"/>
                </g>
                
                <!-- 24 Text -->
                <rect x="120" y="70" width="60" height="40" rx="10" fill="#F5F0E4"/>
                <path d="M140 80 Q150 80 150 90 Q140 100 130 100 H150 M165 80 V100 M165 90 H175 V100 M175 80 V100" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" fill="none"/>
                
                <!-- 7 Text -->
                <rect x="220" y="190" width="40" height="40" rx="10" fill="#1A1A17"/>
                <path d="M230 200 H250 L235 220" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" fill="none"/>
            </g>
          </svg>