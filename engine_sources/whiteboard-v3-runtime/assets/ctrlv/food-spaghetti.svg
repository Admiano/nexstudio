<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Plate -->
                <circle cx="200" cy="180" r="110" fill="#F5F0E4" stroke="#1A1A17" stroke-width="4"/>
                
                <!-- Swirling Noodles -->
                <g stroke="#1A1A17" stroke-width="4" fill="none" opacity="0.8">
                    <path d="M140 180 C140 140 260 140 260 180 C260 220 140 220 140 180"/>
                    <path d="M160 180 C160 160 240 160 240 180 C240 200 160 200 160 180"/>
                    <path d="M120 180 Q200 100 280 180"/>
                    <path d="M110 190 Q200 250 290 190" opacity="0.5"/>
                </g>
                
                <!-- Meatballs -->
                <g>
                    <circle cx="180" cy="160" r="20" fill="#F5F0E4" opacity="0.9"/>
                    <circle cx="230" cy="175" r="18" fill="#F5F0E4" opacity="0.9"/>
                    <circle cx="200" cy="200" r="22" fill="#F5F0E4" opacity="0.9"/>
                </g>
                
                <!-- Tomato Sauce splats -->
                <circle cx="190" cy="170" r="8" fill="#F5F0E4" opacity="0.6"/>
                <circle cx="215" cy="185" r="10" fill="#F5F0E4" opacity="0.6"/>
            </g>
            
            <!-- Fork with twirled noodles -->
            <g style="animation-delay: -1s;">
                <rect x="280" y="40" width="10" height="100" rx="5" fill="#F5F0E4"/>
                <path d="M275 140 L295 140 L295 160 L275 160 Z" fill="#F5F0E4"/>
                <path d="M270 150 Q285 170 300 150" stroke="#1A1A17" stroke-width="4" fill="none"/>
            </g>
          </svg>