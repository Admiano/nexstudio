<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Stadium Track -->
            <g opacity="0.15">
                <path d="M60 220 C140 150 260 150 340 220" stroke="#F5F0E4" stroke-width="12" fill="none"/>
                <path d="M80 240 C160 180 240 180 320 240" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="10 10" fill="none"/>
            </g>
            
            <g>
                <!-- Character Body -->
                <path d="M130 260 C130 150 230 150 230 260 Z" fill="#1A1A17"/>
                <!-- Tank Top/Jersey -->
                <path d="M150 170 C150 200 210 200 210 170" fill="#F5F0E4" opacity="0.3"/>
                <!-- Number 1 -->
                <path d="M175 220 L180 200 V240" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Head -->
                <circle cx="180" cy="120" r="35" fill="#F5F0E4"/>
                <!-- Headband -->
                <path d="M145 110 H215" stroke="#F5F0E4" stroke-width="8"/>
                
                <!-- Prop: Trophy/Medal -->
                <!-- Medal around neck -->
                <path d="M160 150 L180 190 L200 150" stroke="#F5F0E4" stroke-width="3" fill="none"/>
                <circle cx="180" cy="190" r="8" fill="#F5F0E4"/>
                
                <!-- Prop: Trophy -->
                <g style="transform-origin: 260px 150px;">
                    <path d="M240 140 Q260 180 280 140 Z" fill="#F5F0E4"/>
                    <rect x="250" y="180" width="20" height="20" fill="#F5F0E4"/>
                    <path d="M240 140 C220 140 220 160 240 160 M280 140 C300 140 300 160 280 160" stroke="#F5F0E4" stroke-width="4" fill="none"/>
                </g>
            </g>
          </svg>