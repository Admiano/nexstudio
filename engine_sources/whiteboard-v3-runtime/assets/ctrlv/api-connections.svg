                <circle cx="270" cy="150" r="50" fill="#1A1A17" opacity="0.9"/>
                <path d="M260 80 H280 V220 H260 Z M200 140 H340 V160 H200 Z" fill="#1A1A17" opacity="0.9"/>
                <path d="M220 100 L320 200 M220 200 L320 100" stroke="#1A1A17" stroke-width="20" opacity="0.9"/>
                <circle cx="270" cy="150" r="20" fill="white"/>
                <circle cx="270" cy="150" r="10" fill="#F5F0E4"/>
            </g>
            <!-- API Data Transfer Arc -->
            <path d="M150 150 Q210 50 270 150" stroke="#F5F0E4" stroke-width="6" stroke-dasharray="12 12" fill="none" stroke-linecap="round"/>
            <circle cx="210" cy="100" r="8" fill="#F5F0E4"/>
          </svg>