<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Left Large Gear -->
            <g >
                <circle cx="150" cy="150" r="80" fill="#1A1A17"/>
                <path d="M130 50 H170 V250 H130 Z M50 130 H250 V170 H50 Z" fill="#1A1A17"/>
                <path d="M80 80 L220 220 M80 220 L220 80" stroke="#1A1A17" stroke-width="40"/>
                <circle cx="150" cy="150" r="40" fill="white"/>
                <circle cx="150" cy="150" r="20" fill="#F5F0E4" opacity="0.2"/>
            </g>
            <!-- Right Interlocking Gear (Spinning opposite way natively handled via svg if possible, but here static rotated look is fine) -->
