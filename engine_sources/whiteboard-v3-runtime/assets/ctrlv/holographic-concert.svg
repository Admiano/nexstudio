<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>
            <!-- Stage Base -->
            <ellipse cx="200" cy="230" rx="100" ry="20" fill="#F5F0E4"/>
            <ellipse cx="200" cy="225" rx="90" ry="15" fill="#1A1A17"/>
            
            <!-- Hologram Projector Rings -->
            <ellipse  cx="200" cy="225" rx="70" ry="10" fill="none" stroke="#F5F0E4" stroke-width="2"/>
            <ellipse  cx="200" cy="225" rx="50" ry="8" fill="none" stroke="#F5F0E4" stroke-width="2"/>
            
            <!-- Holographic DJ/Artist -->
            <g>
                <path d="M180 200 L220 200 L210 140 L190 140 Z" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="200" cy="120" r="15" fill="#F5F0E4" opacity="0.8"/>
                <!-- DJ Desk -->
                <rect x="170" y="200" width="60" height="25" rx="4" fill="#1A1A17"/>
                <circle cx="185" cy="210" r="8" fill="#F5F0E4"/>
                <circle cx="215" cy="210" r="8" fill="#F5F0E4"/>
            </g>
            
            <!-- Light Beams -->
            <path d="M120 230 L80 60 L100 50 Z" fill="#F5F0E4" opacity="0.2"/>
            <path d="M280 230 L320 60 L300 50 Z" fill="#F5F0E4" opacity="0.2"/>
            
            <!-- Floating Notes -->
            <path d="M220 180 Q250 140 280 100" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="5 15" fill="none" stroke-linecap="round"/>
            <path style="animation-duration: 4s;" d="M180 180 Q150 140 120 100" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="5 15" fill="none" stroke-linecap="round"/>
          </svg>