<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            
            <!-- Footprints -->
            <path d="M120 240 Q130 220 120 200" stroke="#F5F0E4" stroke-width="8" stroke-dasharray="10 15" stroke-linecap="round"/>
            <path style="animation-delay: -0.5s" d="M150 220 Q160 200 150 180" stroke="#F5F0E4" stroke-width="8" stroke-dasharray="10 15" stroke-linecap="round"/>
            
            <!-- Magnifying Glass -->
            <g>
                <circle cx="200" cy="150" r="60" fill="#F5F0E4" opacity="0.1"/>
                <circle cx="200" cy="150" r="60" fill="none" stroke="#1A1A17" stroke-width="10"/>
                <path d="M200 100 A50 50 0 0 1 245 125" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
                <path d="M160 190 L100 250" stroke="#F5F0E4" stroke-width="16" stroke-linecap="round"/>
                <path d="M155 185 L130 210" stroke="#1A1A17" stroke-width="6"/>
                
                <!-- Expanded Fingerprint Clue inside Lens -->
                <path d="M190 120 A20 20 0 0 1 210 120 M180 135 A30 40 0 0 1 220 135 M170 150 A40 60 0 0 1 230 150 M180 165 A20 20 0 0 1 220 165 M190 180 A10 10 0 0 1 210 180" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" fill="none"/>
            </g>
            
            <!-- Deerstalker Hat -->
            <path d="M260 90 Q300 50 340 90 Q320 110 300 110 Q280 110 260 90 Z" fill="#F5F0E4"/>
            <path d="M280 80 Q300 40 320 80 Q320 100 300 110 Q280 100 280 80 Z" fill="#1A1A17"/>
            <!-- Hat flaps -->
            <path d="M280 80 C270 60 290 60 290 80 Z M320 80 C330 60 310 60 310 80 Z" fill="#F5F0E4"/>
            
            <!-- Pipe -->
            <path style="animation-delay: -1s" d="M230 200 L280 230 Q300 240 310 220 L320 220 Q310 250 280 240 L240 215" fill="#F5F0E4"/>
            <path style="animation-delay: -1s" d="M305 210 L325 210 L315 230 L305 210" fill="#1A1A17"/>
            
            <!-- Smoke -->
            <path d="M315 210 Q300 180 330 150 Q300 120 320 90" stroke="#F5F0E4" stroke-width="4" fill="none"/>
          </svg>