<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Abduction Beam -->
            <path d="M180 120 L120 260 H280 L220 120 Z" fill="#F5F0E4" opacity="0.15"/>
            <!-- Falling/rising object -->
            <circle cx="200" cy="200" r="15" fill="#F5F0E4"/>
            
            <g>
                <!-- UFO Beam Source glow -->
                <ellipse cx="200" cy="120" rx="30" ry="10" fill="#F5F0E4" opacity="0.8"/>
                <!-- Saucer Bottom -->
                <ellipse cx="200" cy="110" rx="70" ry="20" fill="#1A1A17"/>
                <!-- Glass Dome -->
                <path d="M160 105 A40 40 0 0 1 240 105 Z" fill="#F5F0E4"/>
                <!-- Dome reflection -->
                <path d="M170 100 A25 25 0 0 1 210 80" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
                <!-- Lights -->
                <circle cx="150" cy="115" r="4" fill="white"/>
                <circle cx="200" cy="120" r="4" fill="white"/>
                <circle cx="250" cy="115" r="4" fill="white"/>
                <!-- Little Alien Silhouette -->
                <circle cx="200" cy="90" r="10" fill="#F5F0E4" opacity="0.6"/>
            </g>
          </svg>