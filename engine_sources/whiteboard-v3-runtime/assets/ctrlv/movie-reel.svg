<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Flowing Film Strip -->
            <path d="M50 250 Q100 150 200 150 T350 250" stroke="#F5F0E4" stroke-width="30" fill="none" opacity="0.8"/>
            <path d="M50 250 Q100 150 200 150 T350 250" stroke="white" stroke-width="26" stroke-dasharray="10 4" fill="none"/>
            <path d="M50 250 Q100 150 200 150 T350 250" stroke="#1A1A17" stroke-width="20" fill="none"/>

            <!-- Main Film Reel Body -->
            <g >
                <circle cx="200" cy="140" r="90" fill="none" stroke="#1A1A17" stroke-width="12"/>
                <circle cx="200" cy="140" r="80" fill="#F5F0E4" opacity="0.1"/>
                <circle cx="200" cy="140" r="20" fill="#1A1A17"/>
                
                <!-- Cutouts -->
                <circle cx="200" cy="90" r="25" fill="#F5F0E4"/>
                <circle cx="200" cy="190" r="25" fill="#F5F0E4"/>
                <circle cx="150" cy="140" r="25" fill="#F5F0E4"/>
                <circle cx="250" cy="140" r="25" fill="#F5F0E4"/>
                
                <circle cx="165" cy="105" r="15" fill="#F5F0E4"/>
                <circle cx="235" cy="105" r="15" fill="#F5F0E4"/>
                <circle cx="165" cy="175" r="15" fill="#F5F0E4"/>
                <circle cx="235" cy="175" r="15" fill="#F5F0E4"/>
                
                <!-- Inner spokes lines -->
                <path d="M200 120 V50 M200 160 V230 M180 140 H110 M220 140 H290" stroke="#1A1A17" stroke-width="6"/>
                
                <!-- Center spindle -->
                <circle cx="200" cy="140" r="5" fill="#F5F0E4"/>
            </g>
            
            <!-- Accents -->
            <circle cx="120" cy="80" r="10" fill="#F5F0E4" opacity="0.6"/>
            <circle cx="280" cy="200" r="6" fill="#F5F0E4"/>
          </svg>