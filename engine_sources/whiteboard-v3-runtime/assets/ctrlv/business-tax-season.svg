<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Tax Form Document -->
                <rect x="100" y="40" width="180" height="240" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8"/>
                <!-- Form Lines -->
                <line x1="120" y1="70" x2="260" y2="70" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                <line x1="120" y1="90" x2="200" y2="90" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Input Boxes -->
                <rect x="120" y="110" width="140" height="20" fill="#1A1A17" opacity="0.2"/>
                <rect x="120" y="140" width="140" height="20" fill="#1A1A17" opacity="0.2"/>
                <rect x="120" y="170" width="140" height="20" fill="#F5F0E4" opacity="0.4"/>
                
                <!-- Tax Stamp -->
                <g transform="translate(240, 220) rotate(-15)">
                    <g>
                    <circle cx="0" cy="0" r="30" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                    <circle cx="0" cy="0" r="24" fill="none" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="4 4"/>
                    <text x="0" y="6" font-family="monospace" font-weight="bold" font-size="16" fill="#F5F0E4" text-anchor="middle">TAX</text>
                </g>
                </g>
                
                <!-- Mini Calculator / Adding Machine Tape -->
                <g transform="translate(280, 100)">
                    <g>
                    <rect x="0" y="0" width="60" height="80" rx="4" fill="#F5F0E4"/>
                    <rect x="10" y="10" width="40" height="20" fill="#F5F0E4"/>
                    <circle cx="20" cy="45" r="4" fill="#F5F0E4"/>
                    <circle cx="30" cy="45" r="4" fill="#F5F0E4"/>
                    <circle cx="40" cy="45" r="4" fill="#F5F0E4"/>
                    <circle cx="20" cy="60" r="4" fill="#F5F0E4"/>
                    <circle cx="30" cy="60" r="4" fill="#F5F0E4"/>
                    <circle cx="40" cy="60" r="4" fill="#F5F0E4"/>
                </g>
                </g>
            </g>
          </svg>