<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Arm Base -->
                <rect x="180" y="240" width="40" height="20" fill="#F5F0E4"/>
                
                <!-- Main Arm Segments -->
                <g >
                    <rect x="190" y="140" width="20" height="100" rx="10" fill="#1A1A17" stroke="#F5F0E4" stroke-width="4"/>
                    
                    <g >
                        <rect x="190" y="60" width="20" height="80" rx="10" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
                        
                        <!-- Claw / Gripper -->
                        <g transform="translate(200, 60)">
                            <path d="M-15 0 Q-15 -20 0 -20 Q15 -20 15 0" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round" fill="none"/>
                            <!-- Item being held -->
                            <rect x="-10" y="-35" width="20" height="20" rx="2" fill="#F5F0E4"/>
                        </g>
                    </g>
                </g>
                
                <!-- Joints -->
                <circle cx="200" cy="240" r="8" fill="#F5F0E4"/>
                <circle cx="200" cy="140" r="8" fill="#F5F0E4"/>
                
                <!-- Energy Spark -->
                <circle cx="200" cy="140" r="15" fill="#F5F0E4" opacity="0.2"/>
            </g>
          </svg>