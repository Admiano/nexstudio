<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Candlestick Chart Background -->
            <g opacity="0.5">
                <!-- Candle 1 -->
                <line x1="100" y1="180" x2="100" y2="240" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                <rect x="90" y="200" width="20" height="30" rx="2" fill="#F5F0E4"/>
                
                <!-- Candle 2 -->
                <line x1="160" y1="120" x2="160" y2="190" stroke="#1A1A17" stroke-width="4" stroke-linecap="round"/>
                <rect x="150" y="130" width="20" height="40" rx="2" fill="#1A1A17"/>
                
                <!-- Candle 3 -->
                <line x1="220" y1="140" x2="220" y2="200" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                <rect x="210" y="160" width="20" height="20" rx="2" fill="#F5F0E4"/>
                
                <!-- Candle 4 -->
                <line x1="280" y1="70" x2="280" y2="150" stroke="#1A1A17" stroke-width="4" stroke-linecap="round"/>
                <rect x="270" y="90" width="20" height="40" rx="2" fill="#1A1A17"/>
            </g>
            
            <g>
                <!-- Abstract Eye for "Analysis/Sight" -->
                <path d="M120 100 Q200 40 280 100 Q200 160 120 100 Z" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8" stroke-linejoin="round"/>
                
                <!-- Iris -->
                <circle cx="200" cy="100" r="30" fill="#F5F0E4"/>
                <circle cx="200" cy="100" r="15" fill="#F5F0E4"/>
                <!-- Eye Highlight -->
                <circle cx="190" cy="90" r="8" fill="#F5F0E4"/>
                
                <!-- Scanning Lasers / Focus Lines -->
                <path d="M200 130 V220" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="8 8" fill="none"/>
                <path style="animation-delay: 0.5s;" d="M160 115 L100 150" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="8 8" fill="none"/>
                <path style="animation-delay: 0.5s;" d="M240 115 L300 150" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="8 8" fill="none"/>
            </g>
          </svg>