<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Large Funnel -->
                <path d="M100 60 H300 L220 180 V240 L180 260 V180 L100 60 Z" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8" stroke-linejoin="round"/>
                
                <!-- Raw Data (Incoming) -->
                <g >
                    <circle cx="150" cy="40" r="8" fill="#1A1A17"/>
                    <rect x="220" y="30" width="12" height="12" fill="#F5F0E4"/>
                    <path d="M200 20 L210 40 L190 40 Z" fill="#F5F0E4"/>
                </g>
                
                <!-- Inside Funnel (Processing) -->
                <g  opacity="0.4">
                    <circle cx="200" cy="100" r="10" fill="#1A1A17"/>
                    <circle cx="170" cy="130" r="6" fill="#F5F0E4"/>
                    <circle cx="230" cy="130" r="6" fill="#F5F0E4"/>
                </g>
                
                <!-- Structured Data (Outgoing) -->
                <g transform="translate(200, 275)">
<g >
                    <rect x="-15" y="0" width="30" height="10" rx="2" fill="#F5F0E4"/>
                </g>
</g>
                
                <!-- Analysis Waves -->
                <path d="M140 120 Q200 150 260 120" stroke="#1A1A17" stroke-width="2" stroke-dasharray="4 4"/>
            </g>
          </svg>