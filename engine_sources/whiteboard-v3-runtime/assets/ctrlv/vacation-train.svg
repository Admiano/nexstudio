<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Tracks -->
            <path d="M60 250 H340 M80 260 H320" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>
            <g>
                <!-- Train Body -->
                <rect x="140" y="100" width="160" height="120" rx="10" fill="#F5F0E4"/>
                <path d="M140 120 C80 120 80 180 80 220 H300 V100 H140 Z" fill="#1A1A17"/>
                
                <!-- Windows -->
                <rect x="160" y="120" width="40" height="40" rx="5" fill="white"/>
                <rect x="220" y="120" width="60" height="40" rx="5" fill="white"/>
                
                <!-- Front Window & Grill -->
                <path d="M80 140 C100 120 120 120 140 120 V160 H80 Z" fill="white"/>
                <rect x="80" y="180" width="40" height="30" rx="5" fill="#F5F0E4"/>
                
                <!-- Detail strip -->
                <path d="M80 170 H300" stroke="#F5F0E4" stroke-width="8"/>
                
                <!-- Wheels -->
                <circle cx="120" cy="230" r="20" fill="#F5F0E4"/>
                <circle cx="200" cy="230" r="20" fill="#F5F0E4"/>
                <circle cx="260" cy="230" r="20" fill="#F5F0E4"/>
                <path d="M120 230 H260" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
            </g>
            <!-- Smoke -->
            <g>
                <circle cx="140" cy="60" r="15" fill="#F5F0E4" opacity="0.8"/>
                <circle cx="110" cy="40" r="20" fill="#F5F0E4" opacity="0.6"/>
                <circle cx="70" cy="30" r="25" fill="#F5F0E4" opacity="0.4"/>
            </g>
          </svg>