<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <g>
                <!-- Eye Chart Paper -->
                <rect x="120" y="40" width="160" height="220" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
                <!-- Chart Top Bar -->
                <rect x="140" y="30" width="120" height="10" fill="#F5F0E4"/>
                
                <!-- Abstract Snellen Chart Letters (represented as lines/shapes for design consistency) -->
                <!-- Top Huge Letter -->
                <path d="M180 80 H220 M200 80 V110" stroke="#1A1A17" stroke-width="15" stroke-linecap="square"/>
                <!-- Row 2 -->
                <circle cx="170" cy="140" r="10" fill="none" stroke="#1A1A17" stroke-width="8"/>
                <rect x="210" y="130" width="20" height="20" fill="none" stroke="#1A1A17" stroke-width="8"/>
                <!-- Row 3 -->
                <path d="M150 180 L160 165 L170 180" fill="none" stroke="#1A1A17" stroke-width="6" stroke-linejoin="round"/>
                <circle cx="200" cy="172" r="8" fill="none" stroke="#1A1A17" stroke-width="6"/>
                <path d="M230 180 V165 H250 V180" fill="none" stroke="#1A1A17" stroke-width="6" stroke-linejoin="round"/>
                <!-- Row 4 smaller -->
                <path d="M140 205 H260 M140 215 H250 M140 225 H240 M140 235 H220" stroke="#F5F0E4" stroke-width="3" opacity="0.5"/>
            </g>
            
            <g>
                <!-- Phoropter / Examining Glasses -->
                <path d="M60 180 Q100 120 180 180 Q200 190 220 180 Q300 120 340 180" fill="none" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Left Lens -->
                <circle cx="130" cy="180" r="35" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                <circle cx="130" cy="180" r="28" fill="#F5F0E4" opacity="0.2"/>
                <!-- Right Lens -->
                <circle cx="270" cy="180" r="35" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                <circle cx="270" cy="180" r="28" fill="#F5F0E4" opacity="0.2"/>
                
                <!-- Bridge -->
                <path d="M165 180 Q200 160 235 180" fill="none" stroke="#F5F0E4" stroke-width="6"/>
                
                <!-- Adjusting knobs -->
                <rect x="120" y="135" width="20" height="10" rx="3" fill="#1A1A17"/>
                <rect x="260" y="135" width="20" height="10" rx="3" fill="#1A1A17"/>
                <!-- Dome reflection -->
                <path d="M165 210 V150 C165 120 180 110 200 110" stroke="#FFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
            </g>
          </svg>