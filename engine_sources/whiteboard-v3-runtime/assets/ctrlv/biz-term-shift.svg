<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Old Framework (Grid) -->
                <g opacity="0.4" stroke="#F5F0E4" stroke-width="4">
                    <rect x="80" y="90" width="80" height="80" rx="5" fill="none"/>
                    <line x1="120" y1="90" x2="120" y2="170"/>
                    <line x1="80" y1="130" x2="160" y2="130"/>
                </g>
                
                <!-- Transforming Arrow -->
                <g>
                    <path d="M170 130 H230 M220 115 L235 130 L220 145" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </g>

                <!-- New Framework (Circle System) -->
                <g fill="#1A1A17">
                    <circle cx="280" cy="130" r="40" opacity="0.2"/>
                    <circle cx="280" cy="130" r="25" opacity="0.6"/>
                    <circle cx="280" cy="130" r="10"/>
                    <circle cx="280" cy="130" r="40" stroke="#1A1A17" stroke-width="4" stroke-dasharray="10 15" fill="none"/>
                </g>
            </g>
          </svg>