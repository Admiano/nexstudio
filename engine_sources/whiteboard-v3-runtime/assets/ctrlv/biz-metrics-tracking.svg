<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Data Grid / Matrix Background -->
            <g fill="#F5F0E4" opacity="0.2">
                <!-- Rows / Cols -->
                <rect x="80" y="60" width="30" height="10" rx="2"/>
                <rect x="120" y="60" width="50" height="10" rx="2"/>
                <rect x="180" y="60" width="40" height="10" rx="2"/>
                <rect x="230" y="60" width="60" height="10" rx="2"/>
                
                <rect x="80" y="90" width="50" height="10" rx="2"/>
                <rect x="140" y="90" width="40" height="10" rx="2"/>
                <rect x="190" y="90" width="60" height="10" rx="2"/>
                <rect x="260" y="90" width="30" height="10" rx="2"/>
                
                <rect x="80" y="120" width="40" height="10" rx="2"/>
                <rect x="130" y="120" width="60" height="10" rx="2"/>
                <rect x="200" y="120" width="30" height="10" rx="2"/>
                <rect x="240" y="120" width="50" height="10" rx="2"/>
                
                <rect x="80" y="150" width="60" height="10" rx="2"/>
