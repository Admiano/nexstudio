<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Maze base -->
            <rect x="60" y="160" width="280" height="110" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>

            <!-- Maze walls -->
            <g stroke="#F5F0E4" stroke-width="5" stroke-linecap="square">
              <line x1="100" y1="160" x2="100" y2="215"/>
              <line x1="140" y1="210" x2="140" y2="270"/>
              <line x1="180" y1="160" x2="180" y2="220"/>
              <line x1="220" y1="200" x2="220" y2="270"/>
              <line x1="260" y1="160" x2="260" y2="230"/>
              <line x1="100" y1="215" x2="180" y2="215"/>
              <line x1="180" y1="230" x2="260" y2="230"/>
            </g>

            <!-- Cheese (Goal) -->
            <g transform="translate(295, 195)">
        <g style="animation-duration: 2s;">
        
              <polygon points="0,0 25,0 25,20 12,30 0,20" fill="#F6C547" stroke="#F5F0E4" stroke-width="3"/>
              <circle cx="8" cy="10" r="4" fill="#F5F0E4" opacity="0.6"/>
              <circle cx="18" cy="16" r="3" fill="#F5F0E4" opacity="0.6"/>
              <circle cx="16" cy="6" r="2" fill="#F5F0E4" opacity="0.6"/>
            
        </g>
    </g>

            <!-- Rat body -->
            <g style="animation-duration: 4s; animation-direction: alternate;">
              <g transform="translate(75, 235)">
                <!-- Body -->
                <ellipse cx="20" cy="0" rx="22" ry="12" fill="#D4B5A0" stroke="#F5F0E4" stroke-width="3"/>
                <!-- Head -->
                <ellipse cx="40" cy="-3" rx="14" ry="11" fill="#D4B5A0" stroke="#F5F0E4" stroke-width="3"/>
                <!-- Ear -->
                <circle cx="38" cy="-13" r="7" fill="#F4C2C2" stroke="#F5F0E4" stroke-width="2"/>
                <!-- Eye -->
                <circle cx="48" cy="-5" r="3" fill="#F5F0E4"/>
                <circle cx="49" cy="-6" r="1" fill="#F5F0E4"/>
                <!-- Nose -->
                <circle cx="54" cy="-1" r="2" fill="#F4C2C2"/>
                <!-- Whiskers -->
                <line x1="54" y1="-2" x2="65" y2="-5" stroke="#F5F0E4" stroke-width="1.5"/>
                <line x1="54" y1="0" x2="65" y2="2" stroke="#F5F0E4" stroke-width="1.5"/>
                <!-- Tail -->
                <path style="animation-duration: 2s;" d="M0 0 Q-15 -10 -25 5 Q-35 15 -40 5" stroke="#F5F0E4" stroke-width="3" stroke-linecap="round" fill="none"/>
                <!-- Feet -->
                <ellipse cx="10" cy="10" rx="5" ry="3" fill="#D4B5A0" stroke="#F5F0E4" stroke-width="2"/>
                <ellipse cx="28" cy="11" rx="5" ry="3" fill="#D4B5A0" stroke="#F5F0E4" stroke-width="2"/>
              </g>
            </g>

            <!-- Lab clipboard above -->
            <g transform="translate(280, 60)">
        <g style="animation-duration: 5s;">
        
              <rect x="0" y="0" width="60" height="80" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
              <rect x="15" y="-8" width="30" height="14" rx="4" fill="#F5F0E4"/>
              <line x1="10" y1="25" x2="50" y2="25" stroke="#F5F0E4" stroke-width="3" opacity="0.3"/>
              <line x1="10" y1="40" x2="50" y2="40" stroke="#F5F0E4" stroke-width="3" opacity="0.3"/>
              <line x1="10" y1="55" x2="40" y2="55" stroke="#F5F0E4" stroke-width="3" opacity="0.3"/>
              <rect x="10" y="60" width="12" height="12" rx="2" fill="#F5F0E4" opacity="0.6"/>
            
        </g>
    </g>
          </svg>