<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Clock Face -->
                <circle cx="200" cy="150" r="100" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8"/>
                
                <!-- Progress Fill (Pomodoro Style) -->
                <path d="M200 150 L200 50 A 100 100 0 0 1 300 150 Z" fill="#1A1A17" opacity="0.2"/>
                
                <!-- Clock Hands -->
                <g >
                    <rect x="195" y="60" width="10" height="90" rx="5" fill="#F5F0E4"/>
                </g>
                <g >
                    <rect x="198" y="50" width="4" height="100" rx="2" fill="#F5F0E4"/>
                </g>
                
                <!-- Tick Marks -->
                <g stroke="#F5F0E4" stroke-width="4" opacity="0.2">
                    <line x1="200" y1="50" x2="200" y2="70"/>
                    <line x1="300" y1="150" x2="280" y2="150"/>
                    <line x1="200" y1="250" x2="200" y2="230"/>
                    <line x1="100" y1="150" x2="120" y2="150"/>
                </g>
                
                <!-- Digital Readout -->
                <g transform="translate(200, 220)">
                    <g >
                    <rect x="-40" y="-15" width="80" height="30" rx="4" fill="#F5F0E4" opacity="0.1"/>
                    <text x="0" y="8" font-family="monospace" font-weight="bold" font-size="16" fill="#1A1A17" text-anchor="middle">25:00</text>
                </g>
                </g>
            </g>
          </svg>