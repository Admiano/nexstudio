<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Desk Surface -->
                <path d="M60 220 L100 200 H300 L340 220 Z" fill="#1A1A17" opacity="0.2"/>
                <line x1="50" y1="220" x2="350" y2="220" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Laptop -->
                <rect x="140" y="120" width="120" height="80" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                <path d="M120 200 H280 L290 210 H110 Z" fill="#F5F0E4"/>
                <rect x="150" y="130" width="100" height="60" fill="#F5F0E4"/>
                
                <!-- Coffee Cup -->
                <g transform="translate(100, 180)">
                    <g>
                    <rect x="0" y="0" width="24" height="30" rx="2" fill="#1A1A17"/>
                    <path d="M24 5 H30 A 5 5 0 0 1 35 10 V15 A 5 5 0 0 1 30 20 H24" stroke="#1A1A17" stroke-width="4" fill="none"/>
                    <rect x="-2" y="-5" width="28" height="5" rx="2" fill="#F5F0E4"/>
                    <!-- Steam -->
                    <path d="M6 -10 Q2 -15 6 -20 T6 -30 M18 -10 Q22 -15 18 -20 T18 -30" stroke="#F5F0E4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
                </g>
                </g>
                
                <!-- Potted Plant (Nomad touch) -->
                <g transform="translate(290, 180)">
                    <g style="animation-delay: 0.2s;">
                    <path d="M0 0 L5 30 H25 L30 0 Z" fill="#F5F0E4"/>
                    <path d="M15 0 C0 -20 -10 0 15 0 Z" fill="#F5F0E4"/>
                    <path d="M15 0 C30 -30 40 -10 15 0 Z" fill="#1A1A17"/>
                    <path d="M15 0 C10 -40 20 -40 15 0 Z" fill="#F5F0E4"/>
                </g>
                </g>
            </g>
          </svg>