<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;">
                <!-- Tracks -->
                <rect x="140" y="220" width="120" height="40" rx="20" fill="#F5F0E4"/>
                <path d="M150 220 H250 M150 260 H250 M140 240 L160 240 M240 240 L260 240" stroke="#1A1A17" stroke-width="4" stroke-dasharray="10 10"/>
                <g transform="translate(170, 240)">
                    <circle style="animation-duration: 10s;" cx="0" cy="0" r="12" fill="#F5F0E4" stroke="#1A1A17" stroke-width="2"/>
                </g>
                <g transform="translate(230, 240)">
                    <circle style="animation-duration: 10s;" cx="0" cy="0" r="12" fill="#F5F0E4" stroke="#1A1A17" stroke-width="2"/>
                </g>
                
                <!-- Main Body -->
                <path d="M150 220 V140 H190 V170 H250 V220 Z" fill="#F5F0E4"/>
                <path d="M160 150 H180 V170 H160 Z" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="4"/>
                
                <!-- Exhaust Pipe -->
                <rect x="220" y="120" width="10" height="50" fill="#F5F0E4"/>
                <g transform="translate(225, 90)">
<g style="animation-duration: 4s; animation-delay: 0.5s;" >
                    <circle cx="0" cy="0" r="10" fill="#F5F0E4" opacity="0.2"/>
                    <circle cx="10" cy="-20" r="15" fill="#F5F0E4" opacity="0.1"/>
                </g>
</g>
                
                <!-- Arm and Blade -->
                <g transform="translate(260, 230)">
<g style="animation-duration: 6s;" >
                    <path style="animation-duration: 4s;" d="M-80 -20 L0 0" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                    <path d="M-10 -30 Q20 -10 0 30 L-20 30 Q10 -10 -20 -30 Z" fill="#1A1A17"/>
                </g>
</g>
                
                <!-- Earth/Dirt Pile -->
                <path style="animation-duration: 4s;" d="M250 260 Q280 200 320 260 Z" fill="#F5F0E4" opacity="0.6"/>
            </g>
          </svg>