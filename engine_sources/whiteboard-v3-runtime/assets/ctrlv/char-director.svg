<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Unspooling Film Strip -->
            <g opacity="0.15" fill="none" stroke="#F5F0E4" stroke-width="40" stroke-dasharray="10 10">
                <path d="M60 200 C80 80 320 80 340 200"/>
            </g>
            
            <g>
                <!-- Character Body -->
                <path d="M130 260 C130 170 230 170 230 260 Z" fill="#F5F0E4"/>
                <!-- Scarf -->
                <path d="M160 180 C180 200 200 180 210 220" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <!-- Head -->
                <circle cx="180" cy="130" r="35" fill="#1A1A17"/>
                <!-- Beret/Director Hat -->
                <path d="M140 120 C140 100 220 100 220 120 Z" fill="#F5F0E4"/>
                <path d="M140 120 H250" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Prop: Megaphone -->
                <g style="transform-origin: 260px 180px;">
                    <path d="M220 180 L280 150 V210 Z" fill="#1A1A17" stroke="#F5F0E4" stroke-width="4"/>
                    <path d="M220 180 H200" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                    <!-- Sound Waves -->
                    <path d="M290 160 Q300 180 290 200 M300 150 Q320 180 300 210" stroke="#F5F0E4" stroke-width="4" fill="none" stroke-linecap="round"/>
                </g>
            </g>
          </svg>