<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Charging Station -->
            <rect x="280" y="120" width="30" height="140" rx="4" fill="#F5F0E4"/>
            <rect x="285" y="130" width="20" height="30" rx="2" fill="#F8FAFC" opacity="0.9"/>
            <circle cx="295" cy="145" r="6" fill="#F5F0E4"/>
            <path d="M295 170 V240" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Cable -->
            <path d="M280 160 Q260 260 190 200" stroke="#F5F0E4" stroke-width="4" fill="none" stroke-linecap="round"/>
            
            <!-- The Car (Modern sleek EV silhouette) -->
            <g>
                <!-- Shadow/Underbody -->
                <rect x="65" y="210" width="160" height="15" rx="5" fill="#F5F0E4" opacity="0.2"/>
                <!-- Main Body -->
                <path d="M60 210 L50 170 Q50 140 100 130 L160 130 Q220 140 230 180 L235 210 Z" fill="#1A1A17"/>
                <!-- Windows/Roof -->
                <path d="M90 135 L105 105 Q125 90 160 95 L200 135 Z" fill="#F8FAFC" opacity="0.8"/>
                <path d="M145 100 V135" stroke="#1A1A17" stroke-width="4"/>
                <!-- Lights -->
                <path d="M60 175 C55 175 50 180 50 185" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                <path d="M230 180 C235 180 235 190 235 195" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
                <!-- Door Lines -->
                <path d="M145 140 V200 M100 145 V200" stroke="#F5F0E4" stroke-width="2" opacity="0.2"/>
                <!-- Charging Port Glow -->
                <circle cx="190" cy="195" r="8" fill="#F5F0E4" opacity="0.6"/>
                <circle cx="190" cy="195" r="4" fill="white"/>
            </g>

            <!-- Wheels -->
            <g>
                <circle cx="95" cy="215" r="22" fill="#F5F0E4"/>
                <circle cx="95" cy="215" r="12" fill="#E2E8F0" stroke="#F5F0E4" stroke-width="4"/>
                
                <circle cx="195" cy="215" r="22" fill="#F5F0E4"/>
                <circle cx="195" cy="215" r="12" fill="#E2E8F0" stroke="#F5F0E4" stroke-width="4"/>
            </g>
            
            <!-- Energy Particles flowing from station to car -->
            <path d="M280 160 Q260 260 190 200" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
          </svg>