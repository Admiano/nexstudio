<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#E2E8F0"/>
            <!-- Tracks -->
            <rect x="60" y="260" width="280" height="4" fill="#1A1A17"/>
            <rect x="80" y="264" width="20" height="10" fill="#F5F0E4"/>
            <rect x="140" y="264" width="20" height="10" fill="#F5F0E4"/>
            <rect x="200" y="264" width="20" height="10" fill="#F5F0E4"/>
            <rect x="260" y="264" width="20" height="10" fill="#F5F0E4"/>
            <rect x="320" y="264" width="20" height="10" fill="#F5F0E4"/>
            
            <!-- Steam puffs -->
            <circle cx="120" cy="80" r="20" fill="#F5F0E4" opacity="0.3"/>
            <circle cx="160" cy="60" r="30" fill="#F5F0E4" opacity="0.4" style="animation-delay: -0.5s;"/>
            <circle cx="220" cy="50" r="40" fill="#F5F0E4" opacity="0.8" style="animation-delay: -1s;"/>
            <circle cx="260" cy="80" r="25" fill="#F5F0E4" opacity="0.3" style="animation-delay: -1.5s;"/>
            
            <g>
                <!-- Boiler -->
                <rect x="180" y="140" width="120" height="80" rx="40" fill="#1A1A17"/>
                <!-- Boiler bands -->
                <rect x="220" y="140" width="10" height="80" fill="#F5F0E4" opacity="0.2"/>
                <rect x="260" y="140" width="10" height="80" fill="#F5F0E4" opacity="0.2"/>
                
                <!-- Cabin -->
                <path d="M100 220 V100 H180 V220 Z" fill="#1A1A17"/>
                <!-- Roof -->
                <rect x="90" y="90" width="100" height="10" rx="5" fill="#F5F0E4"/>
                <!-- Window -->
                <rect x="130" y="120" width="30" height="40" rx="15" fill="#FFF" opacity="0.8"/>
                
                <!-- Chimney -->
                <path d="M260 140 H280 V80 L290 60 H250 L260 80 Z" fill="#F5F0E4"/>
                <!-- Front grill / Pilot -->
                <path d="M300 220 H340 L360 260 H300 Z" fill="#F5F0E4" opacity="0.8"/>
                
                <g >
                    <circle cx="260" cy="240" r="20" fill="#F5F0E4"/>
                    <circle cx="260" cy="240" r="15" fill="#F5F0E4"/>
                    <line x1="260" y1="220" x2="260" y2="260" stroke="#FFF" stroke-width="4"/>
                    <line x1="240" y1="240" x2="280" y2="240" stroke="#FFF" stroke-width="4"/>
                </g>
                <g >
                    <circle cx="190" cy="240" r="20" fill="#F5F0E4"/>
                    <circle cx="190" cy="240" r="15" fill="#F5F0E4"/>
                    <line x1="190" y1="220" x2="190" y2="260" stroke="#FFF" stroke-width="4"/>
                    <line x1="170" y1="240" x2="210" y2="240" stroke="#FFF" stroke-width="4"/>
                </g>
                <g >
                    <circle cx="130" cy="240" r="20" fill="#F5F0E4"/>
                    <circle cx="130" cy="240" r="15" fill="#F5F0E4"/>
                    <line x1="130" y1="220" x2="130" y2="260" stroke="#FFF" stroke-width="4"/>
                    <line x1="110" y1="240" x2="150" y2="240" stroke="#FFF" stroke-width="4"/>
                </g>
                <!-- Connecting Rod -->
                <rect x="130" y="235" width="130" height="10" fill="#F5F0E4"/>
            </g>
          </svg>