<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Fingerprint Scannner Base -->
                <rect x="120" y="60" width="160" height="200" rx="16" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8"/>
                
                <!-- Fingerprint Arcs -->
                <g stroke="#1A1A17" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4">
                    <path d="M160 210 Q200 170 240 210"/>
                    <path d="M150 190 Q200 140 250 190"/>
                    <path d="M170 160 Q200 130 230 160"/>
                    <circle cx="200" cy="190" r="10" stroke-width="4"/>
                </g>
                
                <!-- Scanning Laser Bar -->
                <g style="animation-duration: 2s; animation-iteration-count: infinite;">
                    <line x1="130" y1="100" x2="270" y2="100" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
                    <rect x="130" y="100" width="140" height="10" fill="#F5F0E4" opacity="0.2"/>
                </g>
                
                <!-- Status Icons -->
                <g transform="translate(200, 230)">
                    <g >
                    <circle r="15" fill="#F5F0E4" opacity="0.2"/>
                    <path d="M-6 0 L-2 4 L6 -4" stroke="#F5F0E4" stroke-width="3" fill="none"/>
                </g>
                </g>
            </g>
          </svg>