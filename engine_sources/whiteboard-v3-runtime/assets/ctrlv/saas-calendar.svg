<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Calendar Body -->
                <rect x="120" y="80" width="160" height="160" rx="10" fill="#F5F0E4" stroke="#1A1A17" stroke-width="4"/>
                
                <!-- Calendar Header -->
                <path d="M120 110 H280" stroke="#1A1A17" stroke-width="4"/>
                <path d="M120 90 C120 84 125 80 130 80 H270 C275 80 280 84 280 90 V110 H120 V90 Z" fill="#1A1A17"/>
                
                <!-- Ring Binders -->
                <rect x="150" y="60" width="10" height="30" rx="5" fill="#F5F0E4"/>
                <rect x="240" y="60" width="10" height="30" rx="5" fill="#F5F0E4"/>
                <circle cx="155" cy="90" r="3" fill="#F5F0E4"/>
                <circle cx="245" cy="90" r="3" fill="#F5F0E4"/>
                
                <!-- Grid / Days -->
                <g opacity="0.1" fill="#F5F0E4">
                    <rect x="140" y="130" width="20" height="20" rx="2"/>
                    <rect x="170" y="130" width="20" height="20" rx="2"/>
                    <rect x="200" y="130" width="20" height="20" rx="2"/>
                    <rect x="230" y="130" width="20" height="20" rx="2"/>
                    
                    <rect x="140" y="160" width="20" height="20" rx="2"/>
                    <rect x="170" y="160" width="20" height="20" rx="2"/>
                    <rect x="200" y="160" width="20" height="20" rx="2"/>
                    <rect x="230" y="160" width="20" height="20" rx="2"/>
                    
                    <rect x="140" y="190" width="20" height="20" rx="2"/>
                    <!-- Event day -->
                    <rect x="200" y="190" width="20" height="20" rx="2"/>
                    <rect x="230" y="190" width="20" height="20" rx="2"/>
                </g>
                
                <!-- Highlighted Event -->
                <rect x="170" y="190" width="20" height="20" rx="4" fill="#F5F0E4"/>
                <circle cx="180" cy="200" r="4" fill="#F5F0E4"/>
            </g>
            
            <!-- Floating Clock -->
            <g>
                <circle cx="300" cy="140" r="30" fill="#F5F0E4"/>
                <circle cx="300" cy="140" r="24" fill="#F5F0E4"/>
                <g >
                    <line x1="300" y1="140" x2="300" y2="125" stroke="#F5F0E4" stroke-width="3" stroke-linecap="round"/>
                </g>
                <line x1="300" y1="140" x2="315" y2="140" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                <circle cx="300" cy="140" r="3" fill="#F5F0E4"/>
            </g>
          </svg>