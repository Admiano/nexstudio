<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Body of Van -->
            <rect x="80" y="100" width="240" height="140" rx="30" fill="#1A1A17"/>
            <!-- Stripe -->
            <rect x="80" y="160" width="240" height="20" fill="#F5F0E4"/>
            <!-- Windows -->
            <rect x="110" y="120" width="60" height="40" rx="8" fill="white"/>
            <rect x="190" y="120" width="100" height="40" rx="8" fill="white"/>
            <!-- Wheels -->
            <g >
                <circle cx="130" cy="240" r="30" fill="#F5F0E4"/>
                <circle cx="130" cy="240" r="15" fill="#1A1A17"/>
                <path d="M130 210 V270 M100 240 H160" stroke="#F8FAFC" stroke-width="4"/>
            </g>
            <g >
                <circle cx="290" cy="240" r="30" fill="#F5F0E4"/>
                <circle cx="290" cy="240" r="15" fill="#1A1A17"/>
                <path d="M290 210 V270 M260 240 H320" stroke="#F8FAFC" stroke-width="4"/>
            </g>
            <!-- Luggage on top -->
            <rect x="140" y="60" width="50" height="40" rx="6" fill="#F5F0E4"/>
            <rect x="200" y="70" width="80" height="30" rx="6" fill="#F5F0E4" style="animation-delay:-0.5s"/>
            <!-- Speed lines -->
            <path d="M60 260 H20 M50 240 H10" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
          </svg>