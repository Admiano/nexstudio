<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Flashing Patrol Car Lights -->
            <g opacity="0.3">
                <path d="M100 80 Q140 40 180 80" fill="#F5F0E4"/>
                <path style="animation-delay: 0.5s;" d="M220 80 Q260 40 300 80" fill="#1A1A17"/>
                <rect x="100" y="80" width="80" height="20" rx="5" fill="#F5F0E4"/>
                <rect x="220" y="80" width="80" height="20" rx="5" fill="#F5F0E4"/>
            </g>
            
            <g>
                <!-- Character Body -->
                <path d="M130 260 C130 160 270 160 270 260 Z" fill="#F5F0E4"/>
                <!-- Belt & Radio -->
                <path d="M130 220 H270" stroke="#F5F0E4" stroke-width="12"/>
                <rect x="150" y="210" width="20" height="30" rx="2" fill="#F5F0E4"/>
                <line x1="160" y1="210" x2="160" y2="190" stroke="#F5F0E4" stroke-width="4"/>
                
                <!-- Head -->
                <circle cx="200" cy="120" r="35" fill="#1A1A17"/>
                
                <!-- Police Hat -->
                <path d="M160 100 Q200 60 240 100 Z" fill="#F5F0E4"/>
                <path d="M140 100 H260" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
                <circle cx="200" cy="90" r="6" fill="#F5F0E4"/>
                
                <!-- Prop: Badge -->
                <g>
                    <path d="M220 160 L240 160 L240 180 L230 190 L220 180 Z" fill="#F5F0E4"/>
                    <circle cx="230" cy="170" r="4" fill="#F5F0E4"/>
                </g>
            </g>
          </svg>