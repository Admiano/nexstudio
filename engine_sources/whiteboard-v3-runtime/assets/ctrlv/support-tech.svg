<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Large Gear -->
            <g >
                <circle cx="160" cy="140" r="60" stroke="#1A1A17" stroke-width="20" stroke-dasharray="30 20" fill="none"/>
                <circle cx="160" cy="140" r="40" fill="#F5F0E4"/>
                <circle cx="160" cy="140" r="15" fill="#F5F0E4"/>
            </g>
            <!-- Small Gear -->
            <g >
                <circle cx="260" cy="100" r="35" stroke="#F5F0E4" stroke-width="15" stroke-dasharray="15 15" fill="none"/>
                <circle cx="260" cy="100" r="25" fill="#1A1A17"/>
                <circle cx="260" cy="100" r="10" fill="#F5F0E4"/>
            </g>
            
            <!-- Wrench crossing -->
            <g>
                <path d="M100 260 L280 80" stroke="#F5F0E4" stroke-width="25" stroke-linecap="round"/>
                <path d="M100 260 L280 80" stroke="#F5F0E4" stroke-width="10" stroke-linecap="round"/>
                
                <ellipse transform="rotate(-45 280 80)" cx="280" cy="80" rx="30" ry="20" fill="#F5F0E4"/>
                <circle cx="280" cy="80" r="10" fill="#F5F0E4"/>
                
                <ellipse transform="rotate(-45 100 260)" cx="100" cy="260" rx="20" ry="15" fill="#F5F0E4"/>
                <circle cx="100" cy="260" r="5" fill="#F5F0E4"/>
            </g>
          </svg>