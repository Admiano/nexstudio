<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="120" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <g>
                <!-- Waffle Cone -->
                <path d="M160 180 L200 280 L240 180 Z" fill="#F5F0E4"/>
                <path d="M160 180 L200 280 L240 180 Z" stroke="#1A1A17" stroke-width="2" opacity="0.3" fill="none"/>
                <!-- Lattice pattern -->
                <path d="M170 200 L230 200 M180 230 L220 230" stroke="#1A1A17" stroke-width="2" opacity="0.2"/>
                
                <!-- Scoops -->
                <g>
                    <!-- Bottom Scoop -->
                    <circle cx="200" cy="160" r="45" fill="#1A1A17"/>
                    <path d="M160 180 Q150 200 170 190" fill="#1A1A17"/>
                    
                    <!-- Top Scoop -->
                    <circle cx="200" cy="100" r="40" fill="#F5F0E4"/>
                    
                    <!-- Melting Drips -->
                    <path style="animation-delay: -1s;" d="M240 170 Q245 190 235 185" fill="#1A1A17"/>
                    <path style="animation-delay: -2s;" d="M180 120 Q170 140 190 135" fill="#F5F0E4"/>
                </g>
                
                <rect x="195" y="65" width="8" height="4" fill="#F5F0E4" opacity="0.8"/>
            </g>
          </svg>