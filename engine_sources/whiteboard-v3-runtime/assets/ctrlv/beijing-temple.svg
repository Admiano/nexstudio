            <rect x="120" y="235" width="160" height="15" rx="4" fill="#F5F0E4" opacity="0.1"/>
            <rect x="140" y="220" width="120" height="15" rx="4" fill="#F5F0E4" opacity="0.1"/>
            
            <!-- Building Walls -->
