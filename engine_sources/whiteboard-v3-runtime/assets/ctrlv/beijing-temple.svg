            <path d="M160 180 V220 M180 180 V220 M200 180 V220 M220 180 V220 M240 180 V220" stroke="white" stroke-width="2" opacity="0.4"/>
            
            <rect x="160" y="130" width="80" height="30" fill="#1A1A17"/>
            <rect x="170" y="80" width="60" height="30" fill="#1A1A17"/>
            
            <!-- Roofs (Tier 1 bottom) -->
