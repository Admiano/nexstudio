<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Orbital Rings -->
            <ellipse cx="200" cy="160" rx="120" ry="60" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="10 5" fill="none" opacity="0.2"/>
            <ellipse cx="200" cy="160" rx="160" ry="80" stroke="#F5F0E4" stroke-width="1" stroke-dasharray="4 8" fill="none" opacity="0.4"/>
            <!-- Central Planet Hub -->
            <circle cx="200" cy="160" r="50" fill="#1A1A17"/>
            <circle cx="200" cy="160" r="20" fill="white" opacity="0.2"/>
            <path d="M200 110 L200 60" stroke="#1A1A17" stroke-width="4" stroke-linecap="round"/>
            <circle cx="200" cy="50" r="8" fill="#F5F0E4"/>
            <!-- Orbiting Nodes -->
            <g>
                <circle cx="80" cy="160" r="15" fill="#F5F0E4"/>
                <circle cx="320" cy="160" r="15" fill="#F5F0E4"/>
                <circle cx="120" cy="220" r="12" fill="#F5F0E4"/>
