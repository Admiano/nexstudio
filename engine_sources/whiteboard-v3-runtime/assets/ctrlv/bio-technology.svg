<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Background atmosphere -->
            <path d="M120 180 C80 180 60 120 100 80 C140 40 260 40 300 80 C340 120 320 180 280 180 Z" fill="#F5F0E4" opacity="0.08"/>
            <path d="M150 120 C100 200 200 260 250 180 C300 100 200 40 150 120 Z" fill="#1A1A17" opacity="0.05" style="animation-delay: -1s"/>
            
            <!-- Central Helix Structure -->
            <path d="M180 60 Q240 110 160 160 Q100 200 180 250 M220 60 Q160 110 240 160 Q300 200 220 250" stroke="#1A1A17" stroke-width="8" stroke-linecap="round" fill="none"/>
            <path d="M180 60 Q240 110 160 160 Q100 200 180 250 M220 60 Q160 110 240 160 Q300 200 220 250" stroke="#1A1A17" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.3"/>
            
            <!-- DNA Rungs / Connectors -->
            <path d="M190 75 L210 75 M215 100 L185 100 M170 140 L230 140 M170 180 L230 180 M185 220 L215 220 M190 235 L210 235" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
            
            <!-- Glowing Nodes -->
            <g>
                <circle cx="190" cy="75" r="6" fill="#F5F0E4"/>
                <circle cx="210" cy="75" r="6" fill="#F5F0E4"/>
                <circle cx="170" cy="140" r="8" fill="#F5F0E4"/>
                <circle cx="230" cy="140" r="8" fill="#F5F0E4"/>
                <circle cx="185" cy="220" r="6" fill="#F5F0E4"/>
                <circle cx="215" cy="220" r="6" fill="#F5F0E4"/>
            </g>

            <!-- Floating Molecule / Cells -->
            <g>
                <!-- Top Right Molecule -->
                <circle cx="300" cy="100" r="20" fill="#1A1A17"/>
                <circle cx="280" cy="80" r="10" fill="#F5F0E4"/>
                <circle cx="320" cy="80" r="12" fill="#F5F0E4"/>
                <path d="M290 90 L285 85 M310 90 L315 88" stroke="#F5F0E4" stroke-width="3" stroke-linecap="round"/>
                
                <!-- Bottom Left Molecule -->
                <circle cx="100" cy="200" r="25" fill="#1A1A17"/>
                <circle cx="130" cy="215" r="14" fill="#F5F0E4"/>
                <circle cx="80" cy="225" r="10" fill="#F5F0E4"/>
                <path d="M115 208 L122 212 M88 215 L85 220" stroke="#F5F0E4" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- Microscope view grid overlay circle -->
            <circle cx="200" cy="150" r="120" stroke="#1A1A17" stroke-width="2" stroke-dasharray="10 15" fill="none" opacity="0.2"/>
            <path d="M150 150 H250 M200 100 V200" stroke="#F5F0E4" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
            
            <!-- Digital Analysis overlay -->
            <rect x="260" y="180" width="80" height="40" rx="6" fill="white" opacity="0.9" stroke="#1A1A17" stroke-width="2" style="animation-delay: -0.5s"/>
            <path d="M270 195 H320 M270 205 H300" stroke="#1A1A17" stroke-width="4" stroke-linecap="round"/>
            <circle cx="325" cy="205" r="4" fill="#F5F0E4"/>
          </svg>