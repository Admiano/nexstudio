<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Base / Ground -->
                <line x1="80" y1="260" x2="320" y2="260" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round"/>
                
                <!-- High-rise 1 (Left) -->
                <rect style="animation-delay: 0.2s;" x="110" y="100" width="70" height="160" fill="#1A1A17"/>
                <!-- Windows -->
                <rect x="125" y="120" width="15" height="20" fill="#F5F0E4"/>
                <rect x="150" y="120" width="15" height="20" fill="#F5F0E4"/>
                <rect x="125" y="150" width="15" height="20" fill="#F5F0E4"/>
                <rect x="150" y="150" width="15" height="20" fill="#F5F0E4"/>
                <rect x="125" y="180" width="15" height="20" fill="#F5F0E4"/>
                <rect x="150" y="180" width="15" height="20" fill="#F5F0E4"/>
                
                <!-- High-rise 2 (Center/Front) -->
                <rect x="160" y="60" width="80" height="200" rx="5" fill="#F5F0E4"/>
                <!-- Vertical Glass / Lines -->
                <line x1="180" y1="80" x2="180" y2="240" stroke="#F5F0E4" stroke-width="8"/>
                <line x1="200" y1="80" x2="200" y2="240" stroke="#F5F0E4" stroke-width="8"/>
                <line x1="220" y1="80" x2="220" y2="240" stroke="#F5F0E4" stroke-width="8"/>
                
                <!-- Networking / Connectivity Halo -->
                <path d="M100 140 C100 60 300 60 300 140" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" fill="none"/>
                
                <!-- Nodes -->
                <circle cx="200" cy="72" r="8" fill="#F5F0E4"/>
                <circle style="animation-delay: 0.3s;" cx="120" cy="110" r="6" fill="#F5F0E4"/>
                <circle style="animation-delay: 0.6s;" cx="280" cy="110" r="6" fill="#F5F0E4"/>
                
                <!-- High-rise 3 (Right) -->
                <path style="animation-delay: 0.4s;" d="M230 140 L280 120 V260 H230 Z" fill="#1A1A17" opacity="0.8"/>
            </g>
          </svg>