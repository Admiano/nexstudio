<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;">
                <!-- Concrete Foundation -->
                <rect x="80" y="250" width="240" height="20" rx="4" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="6"/>
                
                <!-- Wall Studs (Verticals) -->
                <g stroke="#1A1A17" stroke-width="10" stroke-linecap="round">
                    <line x1="100" y1="250" x2="100" y2="140"/>
                    <line x1="140" y1="250" x2="140" y2="140"/>
                    <!-- Doorway gap -->
                    <line x1="220" y1="250" x2="220" y2="140"/>
                    <line x1="260" y1="250" x2="260" y2="140"/>
                    <line x1="300" y1="250" x2="300" y2="140"/>
                </g>
                <!-- Header/Top Plate -->
                <line x1="90" y1="140" x2="310" y2="140" stroke="#1A1A17" stroke-width="12" stroke-linecap="round"/>
                
                <!-- Roof Trusses -->
                <g stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                    <path style="animation-duration: 4s;" d="M80 140 L200 40 L320 140"/>
                    <path d="M120 140 L200 75 L280 140"/>
                    <!-- King Post central support -->
                    <line x1="200" y1="140" x2="200" y2="40"/>
                </g>
                
                <!-- Animated Nail/Hammer hit sparks at peak -->
                <g transform="translate(200, 40)">
                    <circle style="animation-duration: 4s;" cx="-15" cy="-15" r="4" fill="#F5F0E4"/>
                    <circle style="animation-duration: 4s; animation-delay: 0.2s;" cx="15" cy="-10" r="3" fill="#F5F0E4"/>
                    <circle style="animation-duration: 4s; animation-delay: 0.4s;" cx="0" cy="-25" r="5" fill="#F5F0E4"/>
                </g>
            </g>
          </svg>