            <path d="M60 160 C110 110 160 210 210 160 C260 110 310 210 360 160" stroke="#1A1A17" stroke-width="6" fill="none" stroke-linecap="round" style="animation-delay: 0.2s;"/>
            <g>
                <!-- Centerpiece (Rakhi Dial) -->
                <circle cx="200" cy="150" r="40" fill="#F5F0E4"/>
