<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#E2E8F0"/>
            
            <!--Network Grid underneath city-->
            <path d="M80 260 L320 260 M100 240 L300 240 M200 240 L160 270 M200 240 L240 270" stroke="#F5F0E4" stroke-width="2" opacity="0.5" fill="none"/>

            <!--Background Buildings-->
            <path d="M120 260 V120 H180 V260 Z" fill="#F5F0E4" opacity="0.2"/>
            <path d="M240 260 V80 H300 V260 Z" fill="#F5F0E4" opacity="0.3" style="animation-delay:-0.5s"/>

            <!--Main Buildings-->
            <path d="M160 260 V100 L200 60 L240 100 V260 Z" fill="#1A1A17"/>
            <!--Glowing Windows / Data Streams-->
            <rect x="180" y="120" width="10" height="20" rx="2" fill="#F5F0E4"/>
            <rect x="210" y="150" width="10" height="20" rx="2" fill="#F5F0E4" style="animation-delay:-0.3s"/>
            <rect x="180" y="180" width="10" height="20" rx="2" fill="#F5F0E4"/>
            <rect x="210" y="210" width="10" height="20" rx="2" fill="#F5F0E4" style="animation-delay:-0.6s"/>
            <rect x="180" y="240" width="10" height="20" rx="2" fill="#F5F0E4"/>

            <!--Smaller Fore - building-->
            <rect x="100" y="180" width="50" height="80" fill="#F5F0E4" opacity="0.8"/>
            <circle cx="125" cy="200" r="10" fill="#F5F0E4"/>
            
            <!--Floating Information Nodes / Drones-->
            <circle cx="140" cy="100" r="8" fill="#F5F0E4"/>
            <circle cx="280" cy="140" r="12" fill="#F5F0E4" style="animation-delay:-0.4s"/>
            <circle cx="320" cy="90" r="6" fill="#1A1A17" style="animation-delay:-0.8s"/>
            
            <!--Connection Arcs between buildings and nodes-->
            <path d="M200 60 Q240 40 280 130" stroke="#1A1A17" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
            <path d="M125 190 Q120 120 140 100" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
          </svg>