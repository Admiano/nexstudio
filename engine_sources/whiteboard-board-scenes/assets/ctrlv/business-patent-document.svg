                    <path d="M0 -15 V-5" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                </g>
                </g>
                
                <!-- Wax Seal / Stamp -->
                <g transform="translate(130, 240)">
                    <g>
                    <circle cx="0" cy="0" r="20" fill="#F5F0E4"/>
                    <circle cx="0" cy="0" r="15" fill="none" stroke="#F5F0E4" stroke-width="2" stroke-dasharray="2 2"/>
                    <path d="M-10 20 L-15 40 L-5 35 L5 40 L0 20 Z" fill="#F5F0E4"/>
                    <path d="M0 20 L5 40 L15 35 L10 20 Z" fill="#1A1A17"/>
