<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Certificate / Document -->
                <rect x="100" y="40" width="200" height="240" fill="#F5F0E4" stroke="#F5F0E4" stroke-width="8"/>
                <rect x="110" y="50" width="180" height="220" fill="none" stroke="#1A1A17" stroke-width="4"/>
                
                <!-- Text Lines -->
                <line x1="140" y1="80" x2="260" y2="80" stroke="#F5F0E4" stroke-width="6" stroke-linecap="round"/>
                <line x1="140" y1="100" x2="220" y2="100" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                <line x1="140" y1="120" x2="260" y2="120" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Lightbulb / Invention Graphic on Doc -->
                <g transform="translate(200, 180)">
                    <g>
                    <circle cx="0" cy="-10" r="25" fill="#F5F0E4"/>
                    <path d="M-15 0 L-10 20 H10 L15 0 Z" fill="#F5F0E4"/>
