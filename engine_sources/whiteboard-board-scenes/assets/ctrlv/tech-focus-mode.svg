<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Zen Garden aesthetic -->
                <!-- Floating Peak -->
                <path d="M120 220 L200 80 L280 220 Z" fill="#1A1A17" opacity="0.2"/>
                <path d="M120 220 L200 80 L280 220" stroke="#F5F0E4" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <!-- Ripples -->
                <g >
                    <circle cx="200" cy="220" r="40" stroke="#F5F0E4" stroke-width="2" fill="none"/>
                    <circle cx="200" cy="220" r="60" stroke="#F5F0E4" stroke-width="1" fill="none" opacity="0.5"/>
                </g>
                
                <!-- Balanced Stones -->
                <g style="animation-duration: 4s;">
                    <ellipse cx="200" cy="210" rx="30" ry="15" fill="#F5F0E4"/>
                    <ellipse cx="200" cy="180" rx="20" ry="10" fill="#1A1A17"/>
                    <ellipse cx="200" cy="160" rx="12" ry="6" fill="#F5F0E4"/>
                </g>
                
                <!-- Rising Spark of Focus -->
                <circle cx="200" cy="80" r="15" fill="#F5F0E4" opacity="0.3"/>
                <circle cx="200" cy="80" r="8" fill="#F5F0E4"/>
            </g>
          </svg>