<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="150" ry="10" fill="#e2e8f0" opacity="0.6"/>
            <!-- Night Sky Moon -->
            <circle cx="300" cy="80" r="30" fill="#F5F0E4" opacity="0.3"/>
            <!-- Taj Mahal Central Base -->
            <rect x="140" y="180" width="120" height="80" fill="#1A1A17"/>
            <!-- Main Dome -->
            <path d="M170 180 C170 110 230 110 230 180 Z" fill="#1A1A17"/>
            <path d="M200 110 L200 80" stroke="#1A1A17" stroke-width="4"/>
            <!-- Minor Domes -->
            <path d="M145 180 C145 150 165 150 165 180 Z" fill="#1A1A17"/>
            <path d="M235 180 C235 150 255 150 255 180 Z" fill="#1A1A17"/>
            <!-- Archway (Charcoal Accent) -->
            <path d="M180 260 V210 C180 190 220 190 220 210 V260 Z" fill="#F5F0E4" opacity="0.2"/>
            
            <!-- Minarets -->
            <!-- Left -->
            <rect x="110" y="140" width="10" height="120" fill="#1A1A17"/>
            <path d="M105 140 H125 L115 120 Z" fill="#1A1A17"/>
            <!-- Right -->
            <rect x="280" y="140" width="10" height="120" fill="#1A1A17"/>
            <path d="M275 140 H295 L285 120 Z" fill="#1A1A17"/>
            
            <!-- Reflection Pool (Water) -->
            <path d="M160 280 H240 M170 290 H230" stroke="#F5F0E4" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
          </svg>