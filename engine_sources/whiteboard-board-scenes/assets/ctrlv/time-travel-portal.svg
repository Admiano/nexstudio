<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Portal rings -->
            <circle cx="200" cy="150" r="80" fill="none" stroke="#1A1A17" stroke-width="8" stroke-dasharray="40 20"/>
            <circle style="animation-direction: reverse; animation-duration: 4s;" cx="200" cy="150" r="100" fill="none" stroke="#F5F0E4" stroke-width="4" stroke-dasharray="30 30"/>
            <!-- Portal Center -->
            <circle cx="200" cy="150" r="60" fill="#F5F0E4" opacity="0.2"/>
            <circle cx="200" cy="150" r="40" fill="#F5F0E4"/>
            <!-- Space/Time warping into it -->
            <path d="M100 50 Q160 100 180 130 M300 50 Q240 100 220 130 M100 250 Q160 200 180 170 M300 250 Q240 200 220 170" stroke="#1A1A17" stroke-width="2" fill="none"/>
            <!-- Floating Clocks / Roman Numerals -->
            <g>
                <circle cx="120" cy="80" r="15" fill="none" stroke="#F5F0E4" stroke-width="2"/>
                <path d="M120 70 V80 L125 85" stroke="#F5F0E4" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g style="animation-delay:-1s">
                <circle cx="280" cy="220" r="20" fill="none" stroke="#F5F0E4" stroke-width="2"/>
                <path d="M280 205 V220 L270 225" stroke="#F5F0E4" stroke-width="2" stroke-linecap="round"/>
            </g>
            <circle cx="190" cy="140" r="4" fill="white"/>
          </svg>