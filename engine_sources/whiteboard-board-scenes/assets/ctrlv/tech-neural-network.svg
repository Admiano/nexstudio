<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Connection Lines -->
                <g stroke="#F5F0E4" stroke-width="2" opacity="0.2">
                    <!-- Layer 1 to 2 -->
                    <path d="M80 100 L180 60 M80 100 L180 150 M80 200 L180 150 M80 200 L180 240"/>
                    <path d="M80 100 L180 240 M80 200 L180 60"/>
                    <!-- Layer 2 to 3 -->
                    <path d="M180 60 L280 150 M180 150 L280 150 M180 240 L280 150"/>
                </g>
                
                <!-- Signal Pulse -->
                <circle cx="80" cy="100" r="12" fill="#1A1A17"/>
                <path d="M80 100 Q180 150 280 150" stroke="#F5F0E4" stroke-width="4" fill="none"/>
                
                <!-- Layer Nodes -->
                <!-- Layer 1 (Input) -->
                <circle cx="80" cy="100" r="15" fill="#1A1A17"/>
                <circle style="animation-delay: 0.2s;" cx="80" cy="200" r="15" fill="#1A1A17"/>
                
                <!-- Layer 2 (Hidden) -->
                <circle style="animation-delay: 0.4s;" cx="180" cy="60" r="15" fill="#F5F0E4"/>
                <circle style="animation-delay: 0.5s;" cx="180" cy="150" r="15" fill="#F5F0E4"/>
                <circle style="animation-delay: 0.6s;" cx="180" cy="240" r="15" fill="#F5F0E4"/>
                
                <!-- Layer 3 (Output) -->
                <g transform="translate(280, 150)">
                    <g >
                    <circle r="30" fill="#F5F0E4" opacity="0.2"/>
                    <circle r="18" fill="#F5F0E4"/>
                    <path d="M-8 0 L-2 6 L8 -6" stroke="#F5F0E4" stroke-width="4" stroke-linecap="round" fill="none"/>
                </g>
                </g>
            </g>
          </svg>