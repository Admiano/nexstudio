<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
                <!-- Wheeled Base -->
                <rect x="120" y="240" width="160" height="15" fill="#1A1A17"/>
                <circle cx="140" cy="255" r="15" fill="#F5F0E4"/>
                <circle cx="140" cy="255" r="5" fill="#F5F0E4"/>
                <circle cx="260" cy="255" r="15" fill="#F5F0E4"/>
                <circle cx="260" cy="255" r="5" fill="#F5F0E4"/>
                
                <!-- Legs -->
                <rect x="150" y="200" width="20" height="40" fill="#1A1A17"/>
                <rect x="230" y="200" width="20" height="40" fill="#1A1A17"/>
                
                <!-- Body -->
                <rect x="130" y="100" width="140" height="100" rx="10" fill="#1A1A17"/>
                
                <!-- Neck and Head -->
                <path d="M250 100 L300 40 L340 60 L320 80 L340 100 L300 120 Z" fill="#1A1A17"/>
                <!-- Eye and Mane -->
                <circle cx="290" cy="65" r="4" fill="#F5F0E4"/>
                <path d="M260 80 L250 60 L280 60 L270 40 L300 40 Z" fill="#F5F0E4"/>
                
                <!-- Tail -->
                <path d="M130 110 L90 140 L130 160 Z" fill="#1A1A17"/>
                
                <!-- Wooden plank textures -->
                <path d="M130 120 H270 M130 140 H270 M130 160 H270 M130 180 H270" stroke="#F5F0E4" stroke-width="2" opacity="0.5"/>
                <line x1="160" y1="200" x2="160" y2="240" stroke="#F5F0E4" stroke-width="2" opacity="0.5"/>
                <line x1="240" y1="200" x2="240" y2="240" stroke="#F5F0E4" stroke-width="2" opacity="0.5"/>
                
                <!-- Hidden door / hatch -->
                <rect x="180" y="130" width="40" height="40" stroke="#F5F0E4" stroke-width="3" fill="none"/>
                <!-- Eye peeking out of a crack -->
                <path d="M190 150 H210 M195 145 H205" stroke="#F5F0E4" stroke-width="2"/>
            </g>
          </svg>