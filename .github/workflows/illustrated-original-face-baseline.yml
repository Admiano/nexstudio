name: V1 canonical original face headshot baseline for native morph QA
on:
  push:
    branches: [work/illustrated-family-expansion-v1]
    paths: ['.github/workflows/illustrated-original-face-baseline.yml']
permissions:
  contents: write
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            experiments/illustrated-family
      - name: Obtain unchanged original formal rig and exact Blender 5.2.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          gh run download 38004823946 --repo Admiano/nexstudio \
             --name NEX_V1_LEAN_SIX_EDITABLE_FORMAL_SCENES --dir input
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libx11-6 libxrender1 libxfixes3 libxi6
          curl -fL --retry 4 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          echo '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  /tmp/blender.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender"
          echo "BLENDER_BIN=$(find "$RUNNER_TEMP/blender" -type f -name blender | head -1)" >> "$GITHUB_ENV"
      - name: Capture original unmodified head geometry from matched portrait camera
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proofs/face-baselines
          for item in female:female-double-breasted male:male-jacket-tie; do
            gender="${item%%:*}"
            variant="${item#*:}"
            input="input/$variant/$variant-front.blend"
            test -s "$input"
            base="proofs/face-baselines/$gender-original"
            "$BLENDER_BIN" -b "$input" -t 4 --python-exit-code 1 \
              --python experiments/illustrated-family/authored_face_render.py \
              -- "$gender" original "$base"
            test -s "$base-front.png"
            test -s "$base-threeq.png"
          done
      - name: Publish real baseline with no generated images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/illustrated-family/native-face-baselines
          cp proofs/face-baselines/*.png docs/illustrated-family/native-face-baselines/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse docs/illustrated-family/native-face-baselines
          git commit -m 'proof(character): matched true Blender original face headshots as morphology control'
          for attempt in 1 2 3; do
            git fetch origin work/illustrated-family-expansion-v1
            git rebase origin/work/illustrated-family-expansion-v1
            if git push origin HEAD:work/illustrated-family-expansion-v1; then exit 0; fi
            sleep 3
          done
          exit 1
