name: SceneBam real approved-cast wardrobe refit
on:
  push:
    branches: [work/scenebam-upgraded-formal-refit-20261013]
    paths: ['.github/workflows/scenebam-upgraded-formals.yml']
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/scenebam-upgraded-formal-bank.py
            scripts/scenebam-formal-qa.py
            scripts/illustrated-family
            scripts/illustrated-family-preview
            experiments/illustrated-family
            engine_sources/makehuman-lineart/NexStudio_Presenter_Reference/characters
            engine_sources/makehuman-lineart/scripts
            engine_sources/makehuman-lineart/presenters_v1
      - name: Install pinned certified Blender 5.2.0
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd libegl1 libgl1 libopengl0 libx11-6 libxrender1 libxfixes3 libxi6
          curl -fL --retry 4 --retry-delay 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          echo '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  /tmp/blender.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender"
          echo "BLENDER_BIN=$(find "$RUNNER_TEMP/blender" -type f -name blender | head -1)" >> "$GITHUB_ENV"
      - name: Refit donor meshes onto the current approved v3 and v6 bodies and render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proofs/scenebam-current-six
          for variant in female-double-breasted female-statement male-jacket-tie male-double-breasted male-navy-classic male-dinner-jacket; do
            echo "::group::$variant"
            mkdir -p "proofs/scenebam-current-six/$variant"
            python scripts/scenebam-upgraded-formal-bank.py --variant "$variant" --blender "$BLENDER_BIN" --archive-cache "$RUNNER_TEMP/certified-donors" --output-dir "proofs/scenebam-current-six/$variant" 2>&1 | tee "proofs/scenebam-current-six/$variant/build.log"
            gender=${variant%%-*}
            "$BLENDER_BIN" -b "proofs/scenebam-current-six/$variant/$variant-front.blend" -t 4 --python-exit-code 1 --python scripts/scenebam-formal-qa.py -- "$gender" "$variant" "proofs/scenebam-current-six/$variant/current-rig-qa.json"
            echo "::endgroup::"
          done
      - name: Build actual Blender contact sheet and all-image manifest
        shell: bash
        run: |
          python scripts/scenebam-real-contact-sheet.py proofs/scenebam-current-six
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCENEBAM_CURRENT_CAST_REAL_REFITS_AND_PREVIEWS
          path: proofs/scenebam-current-six
          retention-days: 14
          compression-level: 3
          if-no-files-found: warn
