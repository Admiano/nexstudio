name: Blender 5.2 bootstrap
on:
  push:
    branches:
      - chatgpt/blender-5-2-bootstrap-v16
    paths:
      - .github/workflows/blender-5-2-bootstrap.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact Blender 5.2.0 runtime
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o blender-5.2.0-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          echo "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  blender-5.2.0-linux-x64.tar.xz" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.0-linux-x64
          path: blender-5.2.0-linux-x64.tar.xz
          compression-level: 0
          retention-days: 1
