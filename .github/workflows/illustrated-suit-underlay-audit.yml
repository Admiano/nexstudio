name: V1 inspect female suit residual skirt geometry
on:
  push:
    branches: [work/illustrated-family-expansion-v1]
    paths: ['.github/workflows/illustrated-suit-underlay-audit.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/illustrated-family
            engine_sources/makehuman-lineart/presenters_v1/scenes
          persist-credentials: true
      - name: Inspect actual saved V1 female source scene
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd libegl1 libgl1 libopengl0 libx11-6 libxrender1
          curl -fL --retry 4 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          echo '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  /tmp/blender.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender"
          BLENDER_BIN="$(find "$RUNNER_TEMP/blender" -type f -name blender | head -1)"
          zstd -q -d -c "engine_sources/makehuman-lineart/presenters_v1/scenes/NEXSTUDIO_V1_FEMALE.blend" > "$RUNNER_TEMP/female.blend"
          mkdir -p docs/illustrated-family/underlay-audit
          "$BLENDER_BIN" -b "$RUNNER_TEMP/female.blend" -t 2 --python-exit-code 1 --python experiments/illustrated-family/diagnose_female_underlay.py -- docs/illustrated-family/underlay-audit/female-canonical-object-census.json
      - name: Publish audit without altering scene
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse docs/illustrated-family/underlay-audit/
          git commit -m "audit(character): female source skirt and line-art geometry inventory"
          for attempt in 1 2 3; do
            git fetch origin work/illustrated-family-expansion-v1
            git rebase origin/work/illustrated-family-expansion-v1
            if git push origin HEAD:work/illustrated-family-expansion-v1; then exit 0; fi
            sleep 2
          done
          exit 1
