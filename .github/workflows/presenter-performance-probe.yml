name: Presenter performance probe

on:
  pull_request:
    branches:
      - devin/1790707046-presenters-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout presenter scene and probe
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            engine_sources/makehuman-lineart/presenters_v1/scenes/BASE_V58.blend
            engine_sources/makehuman-lineart/presenters_v1/performance/probe_presenter_runtime.py
            engine_sources/makehuman-lineart/presenters_v1/performance/scan_native_gestures.py
            engine_sources/makehuman-lineart/presenters_v1/audio/words56.json

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libwayland-client0 libsm6 libice6

      - name: Install exact Blender 5.2.0
        run: |
          cd "$RUNNER_TEMP"
          curl -fL https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o blender.tar.xz
          echo "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  blender.tar.xz" | sha256sum -c -
          mkdir blender
          tar -xJf blender.tar.xz -C blender --strip-components=1

      - name: Probe presenter controls
        env:
          PROBE_OUT: ${{ runner.temp }}/presenter-performance-probe.json
        run: |
          "$RUNNER_TEMP/blender/blender" -b             engine_sources/makehuman-lineart/presenters_v1/scenes/BASE_V58.blend             --python engine_sources/makehuman-lineart/presenters_v1/performance/probe_presenter_runtime.py
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ["RUNNER_TEMP"],"presenter-performance-probe.json")
          d=json.load(open(p))
          print("armatures",[(a["object"],a["bone_count"],a["active_action"]) for a in d["armatures"]])
          print("actions",len(d["actions"]))
          print("shape_keys",len(d["shape_keys"]))
          print("relevant_bones",len(d["relevant_bones"]))
          if not d["armatures"] or not d["actions"]:
              raise SystemExit("probe found no armature/actions")
          PY


      - name: Scan and render native gesture candidates
        env:
          SCAN_OUT: ${{ runner.temp }}/native-gesture-scan
          WORDS_JSON: ${{ github.workspace }}/engine_sources/makehuman-lineart/presenters_v1/audio/words56.json
        run: |
          "$RUNNER_TEMP/blender/blender" -b             engine_sources/makehuman-lineart/presenters_v1/scenes/BASE_V58.blend             --python engine_sources/makehuman-lineart/presenters_v1/performance/scan_native_gestures.py
          python3 -m pip install --user pillow
          python3 - <<'PY'
          import json, os, math
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path(os.environ["RUNNER_TEMP"])/"native-gesture-scan"
          d=json.load(open(root/"native_gesture_candidates.json"))
          peaks=d["peaks"]
          W,H=360,540
          label=74
          cols=4
          rows=math.ceil(len(peaks)/cols)
          sheet=Image.new("RGB",(cols*W,rows*(H+label)),(242,242,239))
          draw=ImageDraw.Draw(sheet); font=ImageFont.load_default()
          for i,c in enumerate(peaks):
              im=Image.open(root/f'frame_{c["frame"]:04d}.png').convert("RGB")
              x=(i%cols)*W; y=(i//cols)*(H+label)
              sheet.paste(im,(x,y))
              txt=f'F{c["frame"]} {c["time"]:.2f}s E={c["smooth_energy"]:.2f}'
              draw.text((x+5,y+H+5),txt,fill=(10,10,10),font=font)
              phrase=(c.get("phrase") or "")[:50]
              draw.text((x+5,y+H+25),phrase,fill=(10,10,10),font=font)
          sheet.save(root/"native-gesture-contact.jpg",quality=84,optimize=True)
          print("CONTACT",root/"native-gesture-contact.jpg")
          PY

      - name: Upload native gesture scan
        uses: actions/upload-artifact@v4
        with:
          name: presenter-native-gesture-scan
          path: |
            ${{ runner.temp }}/native-gesture-scan/native_gesture_candidates.json
            ${{ runner.temp }}/native-gesture-scan/native-gesture-contact.jpg
          retention-days: 7

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: presenter-performance-probe
          path: ${{ runner.temp }}/presenter-performance-probe.json
          retention-days: 7
