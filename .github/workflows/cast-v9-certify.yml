name: Cast V9 certification

on:
  pull_request:
    branches:
      - devin/1790707046-presenters-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cast-v9-certification
  cancel-in-progress: true

env:
  APP_BRANCH: devin/1790231957-offerings-trim-two-families
  BLENDER_URL: https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
  BLENDER_SUMS: https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256

jobs:
  bake-group:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group:
          - lip
          - fem_long
          - fem_bob
          - fem_bangs
          - fem_bun
          - fem_braid
          - male_O1
          - male_O2
          - male_O3
          - male_O4
          - male_O5
    steps:
      - name: Checkout presenter source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            engine_sources/makehuman-lineart/presenters_v1

      - name: Checkout required MakeHuman assets
        uses: actions/checkout@v4
        with:
          ref: mh-assets
          path: mh_assets
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            dress03_cc-by/clothes/mindfront_f_dress_11
            dress03_cc-by/clothes/mindfront_f_dress_09
            dress03_cc-by/clothes/mindfront_f_dress_07
            dress03_cc-by/clothes/punkduck_black_cocktail_dress
            dress03_cc-by/clothes/punkduck_middle_length_qipao
            hair01_cc0/hair/toigo_blunt_bob
            hair01_cc0/hair/toigo_blunt_bob_with_bangs
            hair01_cc0/hair/rehmanpolanski_hair_bun_brown
            hair01_cc0/hair/elvs_french_braid_variation
            makehuman_system_assets_cc0/hair/afro01
            makehuman_system_assets_cc0/hair/short01
            hair02_ccby/hair/elvs_maxwell_hair
            hair02_ccby/hair/elvs_braided_rows
            hair02_ccby/hair/elvs_grump_hair
            makehuman_system_assets_cc0/eyebrows/eyebrow001
            makehuman_system_assets_cc0/eyelashes/eyelashes01
            shirts01_cc0/clothes/namuhekam_male_polo_shirt
            pants02_ccby/clothes/mindfront_male_trousers_1
            shoes02_ccby/clothes/mindfront_shoes_oxford_male
            shirts01_cc0/clothes/toigo_basic_tucked_t-shirt
            pants02_ccby/clothes/elvs_jeans_straight_leg
            shoes02_ccby/clothes/punkduck_comfortable_sneakers
            shirts02_ccby/clothes/elvs_male_shirt_untucked_bd1
            pants02_ccby/clothes/mindfront_male_trousers_2
            shoes02_ccby/clothes/mindfront_shoes_monk_strap_male
            shirts02_ccby/clothes/mindfront_knitted_sweater_01
            pants02_ccby/clothes/punkduck_male_classic_jeans
            shoes02_ccby/clothes/culturalibre_sneakers
            shirts01_cc0/clothes/toigo_fisherman_sweater
            pants01_cc0/clothes/toigo_wool_pants

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libwayland-client0 libsm6 libice6 libopenexr-dev

      - name: Install exact Blender 5.2.0
        run: |
          cd "$RUNNER_TEMP"
          curl -fL "$BLENDER_URL" -o blender.tar.xz
          curl -fL "$BLENDER_SUMS" -o blender.sha256
          grep ' blender-5.2.0-linux-x64.tar.xz$' blender.sha256 | sed 's#blender-5.2.0-linux-x64.tar.xz#blender.tar.xz#' > blender-linux.sha256
          sha256sum -c blender-linux.sha256
          mkdir blender
          tar -xJf blender.tar.xz -C blender --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version | head -2

      - name: Prepare plate packer Python
        run: |
          python3 -m venv "$RUNNER_TEMP/cast-venv"
          "$RUNNER_TEMP/cast-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/cast-venv/bin/pip" install numpy pillow scipy OpenEXR

      - name: Bake group
        env:
          CAST_V9_GROUP: ${{ matrix.group }}
        run: |
          source "$RUNNER_TEMP/cast-venv/bin/activate"
          export MH_ROOT="$GITHUB_WORKSPACE/mh_assets"
          export BLENDER="$RUNNER_TEMP/blender/blender"
          export OUT="$RUNNER_TEMP/cast-v9-out"
          export PLATE_DST="$RUNNER_TEMP/cast-v9-plates"
          cd engine_sources/makehuman-lineart/presenters_v1
          bash bake_cast_v9_group.sh
          ls -lh "$PLATE_DST"

      - name: Upload group plates
        uses: actions/upload-artifact@v4
        with:
          name: cast-v9-${{ matrix.group }}
          path: ${{ runner.temp }}/cast-v9-plates/*.png
          if-no-files-found: error
          retention-days: 7

  merge-test-publish:
    needs: bake-group
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current Cast app branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}
          fetch-depth: 1

      - name: Download and merge all V9 groups
        uses: actions/download-artifact@v4
        with:
          pattern: cast-v9-*
          path: ${{ runner.temp }}/cast-v9-plates
          merge-multiple: true

      - name: Verify complete 62-plate contract
        run: |
          mkdir -p public/cast
          cp "$RUNNER_TEMP/cast-v9-plates/"*.png public/cast/
          python3 - <<'PY'
          from pathlib import Path
          root=Path("public/cast")
          need=set()
          for face in range(3):
              for shade in ("red","berry","coral","nude"):
                  need.add(f"fem_lip_f{face}_{shade}.png")
          for kind in ("sheath","maxi","column","cocktail","qipao"):
              for c in ("navy","burgundy","sage","emerald","rose"):
                  need.add(f"fem_outfit_{kind}_{c}.png")
          for kind in ("o1","o2","o3","o4","o5"):
              for c in ("navy","ivory","blue","burgundy","cream"):
                  need.add(f"male_outfit_{kind}_{c}.png")
          found={p.name for p in Path("$RUNNER_TEMP/cast-v9-plates").glob("*.png")}
          missing=sorted(need-found)
          extra=sorted(found-need)
          if missing or extra:
              raise SystemExit(f"V9 contract failure: missing={missing} extra={extra}")
          print("PASS 62/62 Cast V9 plates merged")
          PY

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run Cast persistence regression
        run: npx tsx tests/cast-spec-persistence.test.ts

      - name: Typecheck NexStudio
        run: npm run typecheck

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexstudio
          APP_BASE_URL: http://127.0.0.1:3000
          AUTH_SECRET: cast-v9-certification-only-not-a-production-secret
        run: npm run build

      - name: Build visual contact proof
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import math
          root=Path("public/cast")
          names=[]
          for face in range(3):
              for shade in ("red","berry","coral","nude"):
                  names.append(f"fem_lip_f{face}_{shade}.png")
          for kind in ("sheath","maxi","column","cocktail","qipao"):
              for c in ("navy","burgundy","sage","emerald","rose"):
                  names.append(f"fem_outfit_{kind}_{c}.png")
          for kind in ("o1","o2","o3","o4","o5"):
              for c in ("navy","ivory","blue","burgundy","cream"):
                  names.append(f"male_outfit_{kind}_{c}.png")
          tw,th,label=150,180,28
          cols=8; rows=math.ceil(len(names)/cols)
          sheet=Image.new("RGB",(cols*tw,rows*(th+label)),(245,245,242))
          draw=ImageDraw.Draw(sheet); font=ImageFont.load_default()
          for i,name in enumerate(names):
              im=Image.open(root/name).convert("RGBA")
              a=im.getchannel("A")
              bbox=a.getbbox()
              if bbox:
                  x0,y0,x1,y1=bbox
                  pad=max(6,int(max(x1-x0,y1-y0)*0.08))
                  crop=im.crop((max(0,x0-pad),max(0,y0-pad),min(im.width,x1+pad),min(im.height,y1+pad)))
              else:
                  crop=im
              bg=Image.new("RGBA",crop.size,(255,255,255,255))
              bg.alpha_composite(crop)
              bg.thumbnail((tw-8,th-8),Image.Resampling.LANCZOS)
              cx=(i%cols)*tw+(tw-bg.width)//2
              cy=(i//cols)*(th+label)+(th-bg.height)//2
              sheet.paste(bg.convert("RGB"),(cx,cy))
              short=name[:-4].replace("fem_outfit_","F ").replace("male_outfit_","M ").replace("fem_lip_","L ")
              draw.text(((i%cols)*tw+4,(i//cols)*(th+label)+th+5),short[:24],fill=(20,20,20),font=font)
          sheet.save("cast-v9-contact.jpg",quality=84,optimize=True)
          print("PASS contact proof built from 62 plates")
          PY

      - name: Commit generated V9 plates to Cast branch
        run: |
          git config user.name "ChatGPT Cast V9"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cast/*.png
          if git diff --cached --quiet; then
            echo "No plate changes to commit."
          else
            git commit -m "feat(cast): add V9 MakeHuman clothing colour and lipstick plates"
            git push origin "HEAD:$APP_BRANCH"
          fi

      - name: Upload certification proof
        uses: actions/upload-artifact@v4
        with:
          name: cast-v9-certification-proof
          path: |
            cast-v9-contact.jpg
            public/cast/fem_outfit_*_*.png
            public/cast/male_outfit_*_*.png
            public/cast/fem_lip_f*_*.png
          if-no-files-found: error
          retention-days: 7
