name: SceneBam corrected-character formalwear refit
on:
  push:
    branches: [work/scenebam-corrected-cast-formals-20261013]
    paths: ['.github/workflows/scenebam-corrected-character-formals.yml']
permissions:
  contents: read
jobs:
  fit-corrected:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/scenebam-corrected-character-formal-bank.py
            scripts/scenebam-corrected-character-contact-sheet.py
            scripts/scenebam-formal-qa.py
            scripts/illustrated-family
            scripts/illustrated-family-preview
            experiments/illustrated-family
            engine_sources/makehuman-lineart/character_system/scene-verification.json
            engine_sources/makehuman-lineart/character_system/scenes/female/sheath
            engine_sources/makehuman-lineart/character_system/scenes/male/shirt
            engine_sources/makehuman-lineart/NexStudio_Presenter_Reference/characters
            engine_sources/makehuman-lineart/scripts
      - name: Install certified Blender 5.2.0
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil zstd libegl1 libgl1 libopengl0 libx11-6 libxrender1 libxfixes3 libxi6
          curl -fL --retry 4 --retry-delay 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          echo '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  /tmp/blender.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender"
          echo "BLENDER_BIN=$(find "$RUNNER_TEMP/blender" -type f -name blender | head -1)" >> "$GITHUB_ENV"
      - name: Fit garment against actual V17 corrected character scenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proofs/scenebam-corrected-cast-formals
          for variant in female-double-breasted female-statement male-jacket-tie male-double-breasted male-navy-classic male-dinner-jacket; do
            echo "::group::$variant"
            mkdir -p "proofs/scenebam-corrected-cast-formals/$variant"
            python scripts/scenebam-corrected-character-formal-bank.py --variant "$variant" --blender "$BLENDER_BIN" --archive-cache "$RUNNER_TEMP/verified-donors" --output-dir "proofs/scenebam-corrected-cast-formals/$variant" 2>&1 | tee "proofs/scenebam-corrected-cast-formals/$variant/build.log"
            gender=${variant%%-*}
            "$BLENDER_BIN" -b "proofs/scenebam-corrected-cast-formals/$variant/$variant-front.blend" -t 4 --python-exit-code 1 --python scripts/scenebam-formal-qa.py -- "$gender" "$variant" "proofs/scenebam-corrected-cast-formals/$variant/current-rig-qa.json"
            echo "::endgroup::"
          done
      - name: Combine real corrected-character renders
        shell: bash
        run: |
          python scripts/scenebam-corrected-character-contact-sheet.py proofs/scenebam-corrected-cast-formals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCENEBAM_CORRECTED_CAST_SIX_REAL_FORMAL_REFITS
          path: proofs/scenebam-corrected-cast-formals
          retention-days: 14
          compression-level: 3
          if-no-files-found: warn
