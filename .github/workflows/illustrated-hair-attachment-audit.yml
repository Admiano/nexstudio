name: V1 original rigged hairstyle attachment audit
on:
  push:
    branches: [work/illustrated-family-expansion-v1]
    paths: ['.github/workflows/illustrated-hair-attachment-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            experiments/illustrated-family
            engine_sources/makehuman-lineart/presenters_v1/scenes
      - name: Open original character scenes and census actual hair attachments
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd libegl1 libgl1 libopengl0 libx11-6 libxrender1
          curl -fL --retry 4 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          echo '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  /tmp/blender.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender"
          BIN="$(find "$RUNNER_TEMP/blender" -type f -name blender | head -1)"
          mkdir -p docs/illustrated-family/hair-attachment-audit
          for gender in FEMALE MALE; do
            src="engine_sources/makehuman-lineart/presenters_v1/scenes/NEXSTUDIO_V1_$gender.blend"
            zstd -q -d -c "$src" > "$RUNNER_TEMP/$gender.blend"
            lower="$(printf '%s' "$gender" | tr '[:upper:]' '[:lower:]')"
            "$BIN" -b "$RUNNER_TEMP/$gender.blend" -t 2 --python-exit-code 1 \
              --python experiments/illustrated-family/hair_attachment_audit.py \
              -- "$lower" "docs/illustrated-family/hair-attachment-audit/$lower.json"
          done
      - name: Publish original character hair evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse docs/illustrated-family/hair-attachment-audit/
          git commit -m "audit(character): document original female and male V1 hair rigs"
          for attempt in 1 2 3; do
            git fetch origin work/illustrated-family-expansion-v1
            git rebase origin/work/illustrated-family-expansion-v1
            if git push origin HEAD:work/illustrated-family-expansion-v1; then exit 0; fi
            sleep 2
          done
          exit 1
